<style>

    --night:#F6F3EA;         /* page background — soft cream */
    --panel:#FFFFFF;         /* card background */
    --panel-2:#EFEAD8;       /* input / recessed background */
    --line:#DCD2B8;          /* borders */
    --ink:#33312A;           /* primary text */
    --ink-dim:#847C67;       /* secondary text */
    --amber:#C79A45;         /* gold — spending / totals */
    --amber-soft:rgba(199,154,69,.16);
    --rose:#C17B87;          /* dusty rose — body / fasting */
    --sage:#6E8F63;          /* primary green — water / meals */
    --violet:#3F5A3A;        /* deep moss — training / upper day */
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--night);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;

  /* ---------- Header ---------- */
  header{

  .navrow{display:flex;align-items:center;gap:10px}
  .navbtn{

    color:var(--ink);font-size:17px;cursor:pointer;
    display:grid;place-items:center;

  .dstamp{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-top:3px}

    text-transform:uppercase;font-weight:500;
  }
  .c-up{background:rgba(155,123,212,.16);color:var(--violet)}
  .c-low{background:rgba(111,176,140,.16);color:var(--sage)}
  .c-rest{background:var(--amber-soft);color:var(--amber)}

  .arc{margin-top:12px;position:relative}
  .arc svg{display:block;width:100%;height:46px;overflow:visible}
  .arclabels{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-dim);
    letter-spacing:.06em;margin-top:2px;
  }
  .arcnote{
    text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;color:var(--amber);letter-spacing:.05em;margin-top:5px;
  }

  /* ---------- Affirmation ---------- */
  .affirm{
    margin:14px 0 4px;padding:13px 15px;border-radius:var(--r);
    background:linear-gradient(100deg,rgba(110,143,99,.14),rgba(199,154,69,.12));
    border:1px solid rgba(110,143,99,.28);
    font-size:13.5px;line-height:1.45;font-style:italic;color:#3A4A34;
  }
  .caffirm-group{
    padding:0 0 11px;margin-bottom:9px;border-bottom:1px dashed var(--line);
  }
  .caffirm-line{
    font-size:12.5px;font-style:italic;color:var(--sage);
    line-height:1.45;margin-bottom:4px;
  }
  .caffirm-line:last-child{margin-bottom:0}

  /* ---------- Cards ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);margin-top:12px;overflow:hidden;
  }
  .chead{
    display:flex;align-items:center;gap:10px;

  }
  .chead:active{background:var(--panel-2)}
  .bar{width:3px;height:19px;border-radius:2px;flex:0 0 3px}
  .ctitle{
    flex:1;font-family:'Archivo Expanded','Inter',sans-serif;font-weight:600;
    font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  }

  .chev{color:var(--ink-dim);font-size:12px;transition:transform .18s}
  .open .chev{transform:rotate(90deg)}
  .cbody{display:none;padding:0 15px 16px}
  .open .cbody{display:block}

  /* ---------- Fields ---------- */
  .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .lab{flex:1;font-size:13.5px;color:var(--ink-dim)}
  input,textarea{
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;width:100%;

  input.num{width:82px;flex:0 0 82px;text-align:center;font-family:'IBM Plex Mono',monospace}
  textarea{resize:vertical;min-height:62px;line-height:1.45}
  .stack{padding:9px 0;border-top:1px solid var(--line)}
  .stack:first-child{border-top:0}
  .stack .lab{margin-bottom:6px;display:block}

  .tog{

    border:1px solid var(--line);background:var(--panel-2);

  .sbtn{

  .dot{

    border:1.5px solid var(--line);background:var(--panel-2);

    font-size:13px;letter-spacing:.07em;text-transform:uppercase;

    background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

// Seeded shuffle so each day's picks feel fresh rather than repeating in a fixed order
function ahash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  const rand = () => { s = (s*16807) % 2147483647; return (s-1)/2147483646; };
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pickAffirms(section, count){
  const pool = AFFIRM[section];
  const dayIndex = Math.floor(cur.getTime()/86400000);
  const cycle = Math.floor(dayIndex / pool.length);           // reshuffles fresh each time pool is exhausted
  const posInCycle = dayIndex % pool.length;
  const shuffled = seededShuffle(pool, cycle*7919 + ahash(section));
  const picks = [];
  for(let i=0;i<count;i++){ picks.push(shuffled[(posInCycle+i) % pool.length]); }
  return picks;
}
function caffirmBlock(section, count){
  return `<div class="caffirm-group">${pickAffirms(section,count).map(l=>`<div class="caffirm-line">${l}</div>`).join('')}</div>`;
}

const LS_PREFIX = 'wellness90:day:';
async function load(k){
  try{
    const raw = localStorage.getItem(LS_PREFIX+k);
    if(!raw) return blank();
    const parsed = JSON.parse(raw);
    const merged = blank();
    for(const key in parsed){ merged[key] = parsed[key]; }
    if(parsed.spend) merged.spend = Object.assign({food:'',supp:'',gym:'',biz:'',other:''}, parsed.spend);
    if(parsed.practices) merged.practices = Object.assign({mirror:false,reverse:false,future:false,silence:false,patterns:false}, parsed.practices);
    if(!Array.isArray(parsed.exercises) || parsed.exercises.length!==6){
      merged.exercises = [{n:'',s:'',r:'',w:''},{n:'',s:'',r:'',w:''},{n:'',s:'',r:'',w:''},
                           {n:'',s:'',r:'',w:''},{n:'',s:'',r:'',w:''},{n:'',s:'',r:'',w:''}];
    }
    return merged;
  }catch(e){
    return blank();
  }

/* ============ Signature: dawn arc ============ */
function drawArc(){
  const dow = cur.getDay();
  const rest = dow === 6;
  const now = new Date();
  const same = key(now) === key(cur);
  const hr = now.getHours() + now.getMinutes()/60;
  const X = h => 4 + (h/24)*332;

  // Sunday closes the window at 20:00 into the long fast
  const eatEnd = dow === 0 ? 20 : 20.5;

  const seg = (a,b,fill,op=1) =>
    `<rect x="${X(a)}" y="16" width="${X(b)-X(a)}" height="13" rx="3" fill="${fill}" opacity="${op}"/>`;

  let s = '';
  s += seg(0,24,'#EFEAD8');                                  // base: fasted
  if(!rest) s += seg(4,5.5,'#3F5A3A',.9);                    // training block
  s += seg(12,eatEnd,'#6E8F63',.85);                         // eating window
  if(dow === 0) s += seg(20,24,'#C17B87',.8);                // extended fast begins

  // tick marks
  [4,12,20].forEach(h=>{
    s += `<line x1="${X(h)}" y1="12" x2="${X(h)}" y2="33" stroke="#DCD2B8" stroke-width="1"/>`;
  });

  if(same){
    s += `<line x1="${X(hr)}" y1="8" x2="${X(hr)}" y2="37" stroke="#C79A45" stroke-width="2"/>`;
    s += `<circle cx="${X(hr)}" cy="8" r="3.5" fill="#C79A45"/>`;
  }
  document.getElementById('arcsvg').innerHTML = s;

  const note = document.getElementById('arcnote');
  if(!same){ note.textContent = ''; return; }
  if(dow === 0 && hr >= 20)      note.textContent = 'Extended fast in progress — until Tue 12 PM';
  else if(hr < 4)                note.textContent = `Fasted · ${(4-hr).toFixed(1)}h until training`;
  else if(hr < 5.5 && !rest)     note.textContent = 'Training window — aminos in the bottle';
  else if(hr < 12)               note.textContent = `Fasted · ${(12-hr).toFixed(1)}h until you eat`;
  else if(hr < eatEnd)           note.textContent = `Eating window · ${(eatEnd-hr).toFixed(1)}h remaining`;
  else                           note.textContent = 'Window closed — creatine before bed';
}

/* ============ Dashboard ============ */
let view = 'day';
const START_KEY = 'wellness90:start';

function getStart(){
  let s = localStorage.getItem(START_KEY);
  if(!s){ s = key(new Date()); localStorage.setItem(START_KEY, s); }
  return s;
}
function setStart(dateStr){ localStorage.setItem(START_KEY, dateStr); }
function dateFromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); }

function computeDashboard(){
  const startStr = getStart();
  const start = dateFromKey(startStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=0;i<90;i++){
    const d = new Date(start.getTime() + i*86400000);
    const k = key(d);
    let dayData = null;
    try{ const raw = localStorage.getItem(LS_PREFIX+k); if(raw) dayData = JSON.parse(raw); }catch(e){}
    days.push({date:d, key:k, data:dayData, dow:d.getDay()});
  }

  let trained=0, cardioSessions=0, cardioMinTotal=0, proteinSum=0, proteinDays=0,
      waterSum=0, waterDays=0, spendSum=0, wins=0, learnDays=0, journalDays=0,
      bestPush=0, bestPull=0, practiceDays=0;
  const weightPoints = [];

  days.forEach(day=>{
    if(!day.data) return;
    const d = day.data;
    if(d.trained) trained++;
    if(d.cardioDone) cardioSessions++;
    if(d.cardioMin) cardioMinTotal += parseFloat(d.cardioMin)||0;
    const p = (d.meals||[]).reduce((s,m)=>s+(parseFloat(m.p)||0),0);
    if(p>0){ proteinSum+=p; proteinDays++; }
    if(d.water){ waterSum += d.water*WATER_UNIT_OZ; waterDays++; }
    if(d.spend) spendSum += Object.values(d.spend).reduce((s,v)=>s+(parseFloat(v)||0),0);
    if(d.win) wins++;
    if(d.learn) learnDays++;
    if(d.journal) journalDays++;
    if(d.practices && Object.values(d.practices).some(Boolean)) practiceDays++;
    if(Array.isArray(d.push) && d.push.length) bestPush = Math.max(bestPush, ...d.push);
    if(Array.isArray(d.pull) && d.pull.length) bestPull = Math.max(bestPull, ...d.pull);
    if(day.dow===1 && d.weight) weightPoints.push({key:day.key, w:parseFloat(d.weight)});
  });

  const daysLogged = days.filter(d=>d.data).length;
  const daysElapsed = days.filter(d=>d.date<=today).length;
  const weightChange = weightPoints.length>=2 ? (weightPoints[weightPoints.length-1].w - weightPoints[0].w) : null;

  return { days, startStr, today, daysLogged, daysElapsed, trained, cardioSessions, cardioMinTotal,
    avgProtein: proteinDays ? Math.round(proteinSum/proteinDays) : 0,
    avgWater: waterDays ? Math.round(waterSum/waterDays) : 0,
    spendSum, wins, learnDays, journalDays, practiceDays, bestPush, bestPull, weightPoints, weightChange };
}

function renderDashboard(){
  const s = computeDashboard();
  const pct = Math.round((s.daysElapsed/90)*100);

  // 90-day heatmap
  let heatCells = '';
  s.days.forEach(day=>{
    let cls = 'future';
    if(day.date <= s.today){
      if(day.dow === 6) cls = 'rest';
      else if(day.data && day.data.trained) cls = 'trained';
      else if(day.date < s.today) cls = 'missed';
      else cls = 'future';
    }
    heatCells += `<div class="heatcell ${cls}" title="${day.key}"></div>`;
  });

  // weight sparkline
  let sparkHtml;
  if(s.weightPoints.length >= 2){
    const vals = s.weightPoints.map(p=>p.w);
    const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
    const W = 320, H = 80, pad = 6;
    const xStep = (W - pad*2) / (s.weightPoints.length - 1);
    const yFor = v => H - pad - ((v-min)/(max-min))*(H-pad*2);
    const pts = s.weightPoints.map((p,i)=>`${pad+i*xStep},${yFor(p.w).toFixed(1)}`).join(' ');
    const dots = s.weightPoints.map((p,i)=>
      `<circle cx="${pad+i*xStep}" cy="${yFor(p.w).toFixed(1)}" r="3" fill="#6E8F63"/>`).join('');
    sparkHtml = `<div class="sparkwrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="#6E8F63" stroke-width="2"/>${dots}
      </svg></div>
      <div class="hint">${s.weightPoints[0].w} lbs → ${s.weightPoints[s.weightPoints.length-1].w} lbs
      (Monday weigh-ins, ${s.weightPoints.length} logged)</div>`;
  }else{
    sparkHtml = `<div class="muted">Log your weight on Mondays to see your trend appear here.</div>`;
  }

  const stat = (v,k,suf='') => `<div class="stat"><div class="sv">${v}<small>${suf}</small></div><div class="sk">${k}</div></div>`;

  document.getElementById('dashboard').innerHTML = `
    <div class="dcard">
      <div class="dtitle">Program progress</div>
      <div class="progresswrap">
        <div class="progressbar"><div class="progressfill" style="width:${pct}%"></div></div>
        <div class="progresslabel">Day ${Math.min(s.daysElapsed,90)} / 90</div>
      </div>
      <div class="hint">${s.daysLogged} of ${s.daysElapsed} days logged so far</div>
      <div class="startrow">
        <span class="lab">Program start date</span>
        <input type="date" id="startdate" value="${s.startStr}">
      </div>
    </div>

    <div class="dcard">
      <div class="dtitle">At a glance</div>
      <div class="statgrid">
        ${stat(s.trained,'training sessions')}
        ${stat(s.cardioSessions,'cardio walks')}
        ${stat(s.avgProtein,'avg protein/day','g')}
        ${stat(s.avgWater,'avg water/day','oz')}
        ${stat('$'+s.spendSum.toFixed(0),'total spent')}
        ${stat(s.wins,'business wins logged')}
        ${stat(s.learnDays,'learning sessions')}
        ${stat(s.journalDays,'evening journals')}
        ${stat(s.bestPush,'best push-up set')}
        ${stat(s.bestPull,'best pull-up set')}
      </div>
    </div>

    <div class="dcard">
      <div class="dtitle">Weight trend</div>
      ${sparkHtml}
    </div>

    <div class="dcard">
      <div class="dtitle">90-day training map</div>
      <div class="heat">${heatCells}</div>
      <div class="heatlegend">
        <span><i style="background:var(--violet)"></i>Trained</span>
        <span><i style="background:var(--amber-soft);border:1px solid var(--amber)"></i>Rest day</span>
        <span><i style="background:rgba(193,123,135,.4)"></i>Missed</span>
        <span><i style="background:var(--panel-2)"></i>Upcoming</span>
      </div>
    </div>
  `;

  document.getElementById('startdate').addEventListener('change', e=>{
    setStart(e.target.value);
    renderDashboard();
  });
}

  if(t.dataset.toggle){
    const id = t.dataset.toggle;
    openSections.has(id) ? openSections.delete(id) : openSections.add(id);
    t.closest('.card').classList.toggle('open');
    return;
  }
  if(t.dataset.t){
    const k = t.dataset.t;
    data[k] = !data[k]; dirty = true;
    t.classList.toggle('on', data[k]);
    t.textContent = data[k] ? 'Done' : '—';
    return;
  }
  if(t.dataset.s){
    const [arr,i,d] = t.dataset.s.split(':');
    const n = Math.max(0, data[arr][+i] + (+d));
    data[arr][+i] = n; dirty = true;
    const sv = document.querySelector(`[data-sv="${arr}:${i}"]`);
    sv.textContent = n; sv.classList.toggle('zero', n===0);
    const day = SPLIT[cur.getDay()];
    if(day.pp){
      document.querySelector('[data-meta="train"]').textContent =
        `${data.push.reduce((a,b)=>a+b,0)+data.pull.reduce((a,b)=>a+b,0)} reps`;
    }
    return;
  }
  if(t.dataset.w !== undefined){
    const i = +t.dataset.w;
    data.water = (data.water === i+1) ? i : i+1;
    dirty = true; render();
    return;
  }
});

document.addEventListener('input', e=>{
  const el = e.target;
  dirty = true;
  if(el.dataset.f){ data[el.dataset.f] = el.value; }
  else if(el.dataset.ex){
    const [i,k] = el.dataset.ex.split(':');
    data.exercises[+i][k] = el.value;
  }
  else if(el.dataset.m){
    const [i,k] = el.dataset.m.split(':');
    data.meals[+i][k] = el.value;
    if(k==='p'){
      const P = proteinTotal();
      document.getElementById('ptot').innerHTML = `${P}<small>/ 125g</small>`;
      document.querySelector('[data-meta="meals"]').textContent = `${P}g`;
    }
  }
  else if(el.dataset.sp){
    data.spend[el.dataset.sp] = el.value;
    const S = spendTotal();
    document.getElementById('stot').textContent = `$${S.toFixed(2)}`;
    document.querySelector('[data-meta="spend"]').textContent = S ? `$${S.toFixed(0)}` : '';
  }
  else if(el.dataset.f === undefined && el.dataset.m === undefined){
    // textareas bound via data-f already handled
  }
});

async function go(delta){
  if(!ready) return;
  if(dirty) await save();
  cur = new Date(cur.getTime() + delta*86400000);
  data = await load(key(cur));
  dirty = false;
  render();
  window.scrollTo({top:0,behavior:'instant'});
}
async function todayHandler(){
  if(!ready) return;
  if(dirty) await save();
  cur = new Date(); data = await load(key(cur)); dirty=false; render();
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('prev').onclick = ()=>go(-1);
document.getElementById('next').onclick = ()=>go(1);
document.getElementById('save').onclick = ()=>{ if(ready) save(); };
document.getElementById('todaybtn').onclick = todayHandler;
document.getElementById('tab-day').onclick = ()=>setView('day');
document.getElementById('tab-dash').onclick = ()=>setView('dash');

/* ============ Boot ============ */
(async ()=>{
  data = await load(key(cur));
  ready = true;
  setView('day');
  render();
  setInterval(drawArc, 60000);
})();
</script>
</body>
</html>
