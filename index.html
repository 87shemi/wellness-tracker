<title>90-Day Wellness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#F6F3EA;
    --card:#FFFFFF;
    --sage:#6E8F63;
    --sage-dark:#5A7A50;
    --moss:#3F5A3A;
    --gold:#C79A45;
    --rose:#C17B87;
    --teal:#4C8C86;
    --taupe:#948C77;
    --ink:#2B2B26;
    --ink-soft:#6B675C;
    --border:#E4DFCF;
    --danger:#B0473F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.headline{
    font-family:'Archivo Expanded',sans-serif;
    letter-spacing:0.01em;
    color:var(--ink);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,textarea,select,button{font-family:inherit;font-size:15px;}
  a{color:var(--sage-dark);}

  /* ---------- layout ---------- */
  #app-shell{max-width:480px;margin:0 auto;padding-bottom:60px;min-height:100vh;}
  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--cream);
    padding:14px 16px 8px;
    border-bottom:1px solid var(--border);
  }
  header.top h1{font-size:19px;}
  .tabs{display:flex;gap:6px;margin-top:12px;}
  .tab-btn{
    flex:1;border:1px solid var(--border);background:var(--card);
    border-radius:999px;padding:9px 6px;font-size:12.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;text-align:center;
  }
  .tab-btn.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;}
  .date-nav button.navbtn{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    width:38px;height:38px;font-size:16px;cursor:pointer;color:var(--ink);
  }
  .date-label{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .today-btn{
    background:var(--card);border:1px solid var(--sage);color:var(--sage-dark);
    border-radius:10px;padding:0 10px;height:38px;font-size:12px;font-weight:600;cursor:pointer;
  }

  main{padding:14px 16px 40px;}

  /* ---------- cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    margin-bottom:14px;overflow:hidden;
  }
  .card-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;cursor:pointer;user-select:none;
  }
  .card-header .title-wrap{display:flex;align-items:center;gap:8px;}
  .card-header .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .card-header h3{font-size:15.5px;}
  .card-header .chev{color:var(--ink-soft);transition:transform .15s;font-size:13px;}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card-body{padding:0 16px 16px;}
  .card.collapsed .card-body{display:none;}
  .affirm{
    font-size:12.5px;font-style:italic;color:var(--ink-soft);
    line-height:1.5;margin-bottom:12px;padding-bottom:12px;
    border-bottom:1px dashed var(--border);
  }
  .affirm div{margin-bottom:3px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;
    background:#FDFCF8;color:var(--ink);
  }
  .field textarea{min-height:64px;resize:vertical;}
  .field .placeholder-msg{font-size:13px;color:var(--ink-soft);font-style:italic;padding:8px 0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .label{font-size:13.5px;}
  .toggle-row .sub{font-size:11px;color:var(--ink-soft);}
  .switch{
    width:44px;height:26px;border-radius:999px;background:#E1DCC9;position:relative;cursor:pointer;flex-shrink:0;
    transition:background .15s;border:none;
  }
  .switch.on{background:var(--sage);}
  .switch .knob{
    position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch.on .knob{left:21px;}

  .rest-msg{
    background:#FBF7EC;border:1px dashed var(--gold);border-radius:10px;
    padding:16px;text-align:center;color:#8a6b28;font-size:13.5px;font-weight:600;
  }

  /* dots */
  .dots-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
  .water-dot{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--teal);
    background:transparent;cursor:pointer;flex-shrink:0;
  }
  .water-dot.filled{background:var(--teal);}
  .water-sub{font-size:12px;color:var(--ink-soft);}

  /* steppers */
  .stepper-group{display:flex;gap:10px;margin-bottom:10px;}
  .stepper{flex:1;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px;}
  .stepper .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .stepper .ctrl{display:flex;align-items:center;justify-content:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#FDFCF8;cursor:pointer;font-size:15px;
  }
  .stepper .val{font-family:'IBM Plex Mono',monospace;font-weight:600;min-width:20px;}

  table.ex-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;}
  table.ex-table th{text-align:left;color:var(--ink-soft);font-weight:600;padding:4px 3px;font-size:10.5px;text-transform:uppercase;}
  table.ex-table td{padding:3px 2px;}
  table.ex-table input{width:100%;padding:6px 5px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#FDFCF8;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:#FDFCF8;
    font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  }
  .chip.selected{background:var(--taupe);color:#fff;border-color:var(--taupe);}

  .link-row{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;}

  /* dawn arc */
  .dawn-wrap{padding:14px 16px 4px;}
  .status-line{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-family:'IBM Plex Mono',monospace;}

  /* meals tab */
  .meal-block{margin-bottom:16px;}
  .meal-block h4{font-family:'Archivo Expanded',sans-serif;font-size:14.5px;margin-bottom:8px;display:flex;justify-content:space-between;}
  .meal-block h4 .time{color:var(--ink-soft);font-size:12px;font-weight:500;font-family:'IBM Plex Mono',monospace;}
  .food-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);}
  .food-item:last-child{border-bottom:none;}
  .food-item input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--sage);flex-shrink:0;}
  .food-item .fi-name{font-size:13.5px;flex:1;}
  .food-item .fi-macro{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .extra-row{position:relative;padding:8px 0;border-bottom:1px solid var(--border);}
  .extra-row:last-child{border-bottom:none;}
  .extra-search{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#FDFCF8;font-size:13px;}
  .extra-selected{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 2px;}
  .extra-selected .rm{color:var(--danger);cursor:pointer;font-size:12px;font-weight:600;}
  .search-results{
    position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:190px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.1);
  }
  .search-results div{padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border);}
  .search-results div:last-child{border-bottom:none;}
  .search-results div:hover{background:var(--cream);}

  .totals-card{background:#FBF9F1;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .totals-card .trow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
  .totals-card .trow b{font-family:'IBM Plex Mono',monospace;}
  .bar-bg{height:7px;background:var(--border);border-radius:99px;margin-top:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--sage);}

  /* dashboard */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .stat-tile .num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat-tile .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .progress-bar-bg{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0;}
  .progress-bar-fill{height:100%;background:var(--sage);}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .heat-cell{aspect-ratio:1;border-radius:3px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* login */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 26px;
    max-width:360px;width:100%;
  }
  .login-card h1{font-size:20px;margin-bottom:6px;}
  .login-card p{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .login-card button.submit{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--sage);color:#fff;
    font-weight:600;font-size:14.5px;cursor:pointer;margin-top:6px;
  }
  .login-err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}

  .save-indicator{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:11.5px;padding:6px 14px;border-radius:99px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .save-indicator.show{opacity:0.88;}

  .signout-link{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline;}
  [hidden]{display:none!important;}
</style>
</head>

<div id="login-screen">
  <div class="login-card">
    <h1>90-Day Tracker</h1>
    <p>Sign in to continue.</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button class="submit" type="submit">Sign In</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<div id="app-shell" hidden>
  <header class="top">

    </div>
  </header>
  <main id="main-content"></main>
</div>

<div class="save-indicator" id="save-indicator">Saving…</div>

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseIso(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function dow(dateOrStr){
  const d = typeof dateOrStr === 'string' ? parseIso(dateOrStr) : dateOrStr;
  return d.getDay(); // 0 Sun .. 6 Sat
}
function isRestDay(d){ return dow(d)===6; }
function isUpperDay(d){ const x=dow(d); return x===1||x===3||x===4; }
function isNoMealDay(d){ return dow(d)===1; } // Monday = full fast
function eatingWindow(d){
  const x = dow(d);
  if (x===1) return null; // Monday fasted all day
  const close = x===0 ? '18:00' : '18:30';
  return { open:'10:00', close };
}
function trainingLabel(d){
  const x = dow(d);
  const map = {
    1:"Upper Body A — Chest, Shoulders, Triceps, Core",
    2:"Lower Body A — Glutes, Quads, Hamstrings, Calves",
    3:"Upper Body B — Back, Biceps, Rear Delts, Core",
    4:"Upper Body C — Shoulders, Back, Arms",
    5:"Lower Body B — Glutes, Hamstrings, Abductors",
    6:"Rest (Sabbath)",
    0:"Lower Body C — active recovery"
  };
  return map[x];
}
function fmtDateLabel(d){
  const today = isoDate(new Date());
  const s = isoDate(d);
  const opts = { weekday:'short', month:'short', day:'numeric' };
  let lbl = d.toLocaleDateString('en-US', opts);
  if (s===today) lbl += ' (Today)';
  return lbl;
}
function round1(n){ return Math.round(n*10)/10; }

/* seeded shuffle affirmations */
function hashStr(s){
  let h=1779033703 ^ s.length;
  for(let i=0;i<s.length;i++){
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = h<<13 | h>>>19;
  }
  return (h^h>>>16)>>>0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const a = arr.slice();
  const rand = mulberry32(seed);
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function dayIndexFor(dateStr){
  const dt = parseIso(dateStr);
  const epoch = new Date(2020,0,1);
  return Math.round((dt-epoch)/86400000);
}
function getAffirmations(category, dateStr){
  const pool = AFFIRMATIONS[category];
  const count = AFFIRM_COUNTS[category];
  const poolLen = pool.length;
  const dayIdx = dayIndexFor(dateStr);
  let offset = dayIdx * count;
  const result = [];
  while(result.length < count){
    const cycleNum = Math.floor(offset/poolLen);
    const idxInCycle = offset % poolLen;
    const shuffled = seededShuffle(pool, hashStr(category+':'+cycleNum));
    result.push(shuffled[idxInCycle]);
    offset++;
  }
  return result;
}
function affirmHtml(category){
  return `<div class="affirm">${getAffirmations(category, isoDate(state.currentDate)).map(a=>`<div>"${a}"</div>`).join('')}</div>`;
}

function defaultMeals(){
  return MEAL_TEMPLATE.map(m => ({
    time: m.time,
    items: m.items.map(it => ({ name:it.name, cal:it.cal, protein:it.protein, carb:it.carb, fat:it.fat, checked:true })),
    extras: [null,null,null]
  }));
}
function defaultDay(dateStr){
  return {
    date: dateStr,
    weight: null,
    energy: null,
    sleep: null,
    cycleNotes: '',
    water: 0,
    creatine: false,
    aminos: false,
    vitamins: false,
    trained: false,
    push: [0,0,0],
    pull: [0,0,0],
    exercises: Array.from({length:6}, ()=>({name:'',sets:'',reps:'',weight:''})),
    feel: null,
    cardio: { completed:false, duration:'', steps:'', route:'' },
    meals: defaultMeals(),
    mealNotes: '',
    spend: { food:0, supplements:0, gym:0, business:0, other:0 },
    learning: { source:'', insight:'', amount:'' },
    business: { win:'', revenue:'', nextStep:'' },
    evening: { practices:{ mirror:false, reverseJournal:false, imagine:false, silence:false, patterns:false }, practiceNote:'', journal:'' }
  };
}
function num(v, fallback){ const n = Number(v); return isFinite(n) ? n : fallback; }
function mergeDay(base, saved){
  if (!saved) return base;
  const out = JSON.parse(JSON.stringify(base));
  for (const k of ['weight','energy','sleep','cycleNotes','water','creatine','aminos','vitamins','trained','feel','mealNotes']){
    if (saved[k] !== undefined) out[k] = saved[k];
  }
  if (Array.isArray(saved.push)) out.push = [0,1,2].map(i=>num(saved.push[i],0));
  if (Array.isArray(saved.pull)) out.pull = [0,1,2].map(i=>num(saved.pull[i],0));
  if (Array.isArray(saved.exercises)){
    out.exercises = out.exercises.map((def,i)=>{
      const s = saved.exercises[i];
      return s ? { name:s.name||'', sets:s.sets||'', reps:s.reps||'', weight:s.weight||'' } : def;
    });
  }
  if (saved.cardio) out.cardio = { completed:!!saved.cardio.completed, duration:saved.cardio.duration||'', steps:saved.cardio.steps||'', route:saved.cardio.route||'' };
  if (saved.spend) out.spend = { food:num(saved.spend.food,0), supplements:num(saved.spend.supplements,0), gym:num(saved.spend.gym,0), business:num(saved.spend.business,0), other:num(saved.spend.other,0) };
  if (saved.learning) out.learning = { source:saved.learning.source||'', insight:saved.learning.insight||'', amount:saved.learning.amount||'' };
  if (saved.business) out.business = { win:saved.business.win||'', revenue:saved.business.revenue||'', nextStep:saved.business.nextStep||'' };
  if (saved.evening){
    out.evening = {
      practices: Object.assign({ mirror:false, reverseJournal:false, imagine:false, silence:false, patterns:false }, saved.evening.practices||{}),
      practiceNote: saved.evening.practiceNote||'',
      journal: saved.evening.journal||''
    };
  }
  if (Array.isArray(saved.meals)){
    out.meals = out.meals.map((defMeal, mi) => {
      const sm = saved.meals[mi];
      if (!sm) return defMeal;
      const items = defMeal.items.map((defItem, ii) => {
        const si = Array.isArray(sm.items) ? sm.items[ii] : null;
        if (!si) return defItem;
        return {
          name: si.name || defItem.name,
          cal: num(si.cal, defItem.cal),
          protein: num(si.protein, defItem.protein),
          carb: num(si.carb, 0),
          fat: num(si.fat, 0),
          checked: si.checked !== undefined ? !!si.checked : true
        };
      });
      const extras = [0,1,2].map(ei => {
        const se = Array.isArray(sm.extras) ? sm.extras[ei] : null;
        if (!se || !se.name) return null;
        return { name:se.name, cal:num(se.cal,0), protein:num(se.protein,0), carb:num(se.carb,0), fat:num(se.fat,0) };
      });
      return { time: defMeal.time, items, extras };
    });
  }
  return out;
}

/* =========================================================================
   DAWN ARC
   ========================================================================= */
function dawnArcSvg(d){
  const width=358, height=54, y=20, h=14;
  const totalMin = 24*60;
  const toX = m => (m/totalMin)*width;
  const segs = [];
  segs.push({from:0, to:totalMin, color:'#EDE9DC'}); // base fasted
  if (!isRestDay(d)){
    segs.push({from:4*60, to:5*60+30, color:'var(--moss)'});
  }
  const win = eatingWindow(d);
  if (win){
    const [oh,om] = win.open.split(':').map(Number);
    const [ch,cm] = win.close.split(':').map(Number);
    const openMin = oh*60+om, closeMin = ch*60+cm;
    segs.push({from:openMin, to:closeMin, color:'var(--sage)'});
    if (dow(d)===0){
      segs.push({from:closeMin, to:totalMin, color:'var(--rose)'});
    }
  }
  let rects = segs.map(s=>`<rect x="${toX(s.from)}" y="${y}" width="${toX(s.to)-toX(s.from)}" height="${h}" fill="${s.color}" rx="3"/>`).join('');
  let marker = '';
  const todayStr = isoDate(new Date());
  if (isoDate(d) === todayStr){
    const now = new Date();
    const nowMin = now.getHours()*60+now.getMinutes();
    const x = toX(nowMin);
    marker = `<line x1="${x}" y1="${y-4}" x2="${x}" y2="${y+h+4}" stroke="var(--gold)" stroke-width="2"/><circle cx="${x}" cy="${y-6}" r="4" fill="var(--gold)"/>`;
  }
  const labelsY = y+h+16;
  const labels = [0,6,12,18,24].map(hr=>`<text x="${toX(hr*60)}" y="${labelsY}" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-family="IBM Plex Mono, monospace">${hr}</text>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${rects}${marker}${labels}</svg>`;
}
function statusLine(d){
  const todayStr = isoDate(new Date());
  if (isoDate(d) !== todayStr) return fmtDateLabel(d);
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const events = [];
  if (!isRestDay(d)){ events.push([4*60,'Training']); events.push([5*60+30,'Post-training fast']); }
  const win = eatingWindow(d);
  if (win){
    const [oh,om]=win.open.split(':').map(Number); const [ch,cm]=win.close.split(':').map(Number);
    events.push([oh*60+om, 'Eating window']);
    events.push([ch*60+cm, dow(d)===0 ? 'Extended fast begins' : 'Fasting']);
  } else {
    events.push([0,'Extended fast']);
  }
  events.sort((a,b)=>a[0]-b[0]);
  let current = events[events.length-1];
  for (const ev of events){ if (ev[0] <= nowMin) current = ev; }
  let next = events.find(ev => ev[0] > nowMin);
  if (!next) next = [24*60 + events[0][0], events[0][1]];
  const remaining = round1((next[0]-nowMin)/60);
  return `${current[1]} · ${remaining}h remaining`;
}

    <div class="field"><label>Water (${d.water*12}oz of 108oz)</label>
      <div class="dots-row">${Array.from({length:9},(_,i)=>`<div class="water-dot ${i<d.water?'filled':''}" onclick="tapWaterDot(${i+1})"></div>`).join('')}</div>
      <div class="water-sub">Tap a dot to fill up to it; tap the last filled dot again to remove one.</div>
    </div>
    <div class="toggle-row"><div><div class="label">Creatine 5g</div><div class="sub">before bed</div></div>${switchHtml('sw-creatine', d.creatine, "toggleField('creatine')")}</div>
    ${!isRestDay(dt) ? `<div class="toggle-row"><div><div class="label">BCAAs + EAAs</div><div class="sub">during training</div></div>${switchHtml('sw-aminos', d.aminos, "toggleField('aminos')")}</div>` : ''}
    <div class="toggle-row"><div><div class="label">B12 / D3+K2 / Omega-3</div><div class="sub">with first meal</div></div>${switchHtml('sw-vitamins', d.vitamins, "toggleField('vitamins')")}</div>
  `, false);

  // Training
  let trainingBody = affirmHtml('training');
  if (isRestDay(dt)){
    trainingBody += `<div class="rest-msg">Sabbath rest — no training today.</div>`;
  } else {
    trainingBody += `<div class="toggle-row"><div class="label">Session completed</div>${switchHtml('sw-trained', d.trained, "toggleField('trained')")}</div>`;
    trainingBody += `<div style="font-size:12px;color:var(--ink-soft);margin:8px 0 10px;">${trainingLabel(dt)}</div>`;
    if (isUpperDay(dt)){
      trainingBody += `<div class="stepper-group">${[0,1,2].map(i=>`
        <div class="stepper"><div class="lbl">Push-up ${i+1}</div><div class="ctrl">
          <button onclick="stepPush(${i},-1)">−</button><span class="val">${d.push[i]}</span><button onclick="stepPush(${i},1)">+</button>
        </div></div>`).join('')}</div>`;
      trainingBody += `<div class="stepper-group">${[0,1,2].map(i=>`
        <div class="stepper"><div class="lbl">Pull-up ${i+1}</div><div class="ctrl">
          <button onclick="stepPull(${i},-1)">−</button><span class="val">${d.pull[i]}</span><button onclick="stepPull(${i},1)">+</button>
        </div></div>`).join('')}</div>`;
    } else {
      trainingBody += `<div class="field-msg placeholder-msg" style="margin-bottom:10px;">Push-ups / pull-ups logged on upper body days</div>`;
    }
    trainingBody += `<table class="ex-table"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight</th></tr></thead><tbody>`;
    trainingBody += d.exercises.map((ex,i)=>`<tr>
      <td><input value="${ex.name}" oninput="updateExercise(${i},'name',this.value)"></td>
      <td><input value="${ex.sets}" oninput="updateExercise(${i},'sets',this.value)"></td>
      <td><input value="${ex.reps}" oninput="updateExercise(${i},'reps',this.value)"></td>
      <td><input value="${ex.weight}" oninput="updateExercise(${i},'weight',this.value)"></td>
    </tr>`).join('');
    trainingBody += `</tbody></table>`;
    trainingBody += `<div class="field"><label>How it felt (1–10)</label><input type="number" min="1" max="10" value="${d.feel??''}" oninput="updateField('feel', this.value===''?null:Number(this.value))"></div>`;
  }
  html += cardShell('training','var(--moss)','Training', trainingBody, true);

  // Cardio
  let cardioBody = affirmHtml('cardio');
  if (isRestDay(dt)){
    cardioBody += `<div class="rest-msg">Rest day — no cardio.</div>`;
  } else {
    cardioBody += `<div class="toggle-row"><div class="label">Walk completed</div>${switchHtml('sw-walk', d.cardio.completed, "toggleCardio()")}</div>`;
    cardioBody += `<div class="row2">
      <div class="field"><label>Duration (min)</label><input type="number" value="${d.cardio.duration}" oninput="updateCardio('duration', this.value)"></div>
      <div class="field"><label>Steps</label><input type="number" value="${d.cardio.steps}" oninput="updateCardio('steps', this.value)"></div>
    </div>
    <div class="field"><label>Route</label><input type="text" value="${d.cardio.route}" oninput="updateCardio('route', this.value)"></div>`;
  }
  html += cardShell('cardio','var(--teal)','Cardio', cardioBody, false);

  // Meals summary
  const totals = mealTotalsFor(d, dt);
  html += cardShell('meals-sum','var(--sage)','Meals', `
    ${affirmHtml('meals')}
    <div class="row2">
      <div class="stat-tile"><div class="num">${totals.cal}</div><div class="lbl">Calories today</div></div>
      <div class="stat-tile"><div class="num">${totals.protein}g</div><div class="lbl">Protein today</div></div>
    </div>
    <div style="margin-top:12px;"><a href="#" onclick="selectTab('meals');return false;">View meals →</a></div>
  `, true);

  // Spending
  const spendTotal = Object.values(d.spend).reduce((a,b)=>a+num(b,0),0);
  html += cardShell('spending','var(--gold)','Spending', `
    ${affirmHtml('spending')}
    <div class="row2">
      <div class="field"><label>Food & groceries</label><input type="number" value="${d.spend.food}" oninput="updateSpend('food', this.value)"></div>
      <div class="field"><label>Supplements</label><input type="number" value="${d.spend.supplements}" oninput="updateSpend('supplements', this.value)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Gym & training</label><input type="number" value="${d.spend.gym}" oninput="updateSpend('gym', this.value)"></div>
      <div class="field"><label>Business investment</label><input type="number" value="${d.spend.business}" oninput="updateSpend('business', this.value)"></div>
    </div>
    <div class="field"><label>Other</label><input type="number" value="${d.spend.other}" oninput="updateSpend('other', this.value)"></div>
    <div class="stat-tile"><div class="num">$${round1(spendTotal)}</div><div class="lbl">Total today</div></div>
  `, false);

  // Learning
  html += cardShell('learning','var(--taupe)','Learning', `
    ${affirmHtml('learning')}
    <div class="field"><label>Book / article / course</label><input type="text" value="${d.learning.source}" oninput="updateNested('learning','source', this.value)"></div>
    <div class="field"><label>Key insight</label><textarea oninput="updateNested('learning','insight', this.value)">${d.learning.insight}</textarea></div>
    <div class="field"><label>Pages or minutes</label><input type="number" value="${d.learning.amount}" oninput="updateNested('learning','amount', this.value)"></div>
  `, false);

  // Business
  html += cardShell('business','var(--gold)','Business', `
    ${affirmHtml('business')}
    <div class="field"><label>Win of the day</label><textarea oninput="updateNested('business','win', this.value)">${d.business.win}</textarea></div>
    <div class="field"><label>Revenue / opportunity ($)</label><input type="number" value="${d.business.revenue}" oninput="updateNested('business','revenue', this.value)"></div>
    <div class="field"><label>Next step tomorrow</label><textarea oninput="updateNested('business','nextStep', this.value)">${d.business.nextStep}</textarea></div>
  `, false);

  // Evening
  const practiceLabels = { mirror:'Mirror gazing', reverseJournal:"Reverse journal", imagine:'Imagine your future state', silence:'20 min silence', patterns:"Notice today's patterns" };
  html += cardShell('evening','var(--taupe)','Evening Ritual', `
    ${affirmHtml('evening')}
    <div class="field"><label>Pick at least one tonight</label>
      <div class="chip-row">${Object.keys(practiceLabels).map(k=>`<div class="chip ${d.evening.practices[k]?'selected':''}" onclick="togglePractice('${k}')">${practiceLabels[k]}</div>`).join('')}</div>
    </div>
    <div class="field"><label>Anything worth remembering</label><textarea oninput="updateNested('evening','practiceNote', this.value)">${d.evening.practiceNote}</textarea></div>
    <div class="field"><label>Nightly journal — a few sentences is enough, do this every night</label><textarea oninput="updateNested('evening','journal', this.value)">${d.evening.journal}</textarea></div>
  `, false);

  html += `<div class="signout-link" onclick="sb.auth.signOut()">Sign out</div>`;

  main.innerHTML = html;
  updateDateNav();
}

function updateField(key, val){ state.dayData[key] = val; scheduleSave(); }
function toggleField(key){ state.dayData[key] = !state.dayData[key]; renderToday(); scheduleSave(); }
function toggleCardio(){ state.dayData.cardio.completed = !state.dayData.cardio.completed; renderToday(); scheduleSave(); }
function updateCardio(key, val){ state.dayData.cardio[key] = val; scheduleSave(); }
function updateSpend(key, val){ state.dayData.spend[key] = val===''?0:Number(val); scheduleSave(); renderToday(); }
function updateNested(group, key, val){ state.dayData[group][key] = val; scheduleSave(); }
function togglePractice(key){ state.dayData.evening.practices[key] = !state.dayData.evening.practices[key]; renderToday(); scheduleSave(); }
function updateExercise(i, key, val){ state.dayData.exercises[i][key] = val; scheduleSave(); }
function stepPush(i, delta){ state.dayData.push[i] = Math.max(0, num(state.dayData.push[i],0)+delta); renderToday(); scheduleSave(); }
function stepPull(i, delta){ state.dayData.pull[i] = Math.max(0, num(state.dayData.pull[i],0)+delta); renderToday(); scheduleSave(); }
function tapWaterDot(n){
  state.dayData.water = (state.dayData.water === n) ? n-1 : n;
  renderToday(); scheduleSave();
}

/* =========================================================================
   MEALS TAB
   ========================================================================= */
function mealTotalsFor(d, dt){
  if (isNoMealDay(dt)) return { cal:0, protein:0, carb:0, fat:0 };
  let cal=0, protein=0, carb=0, fat=0;
  d.meals.forEach(m=>{
    m.items.forEach(it=>{ if (it.checked){ cal+=num(it.cal,0); protein+=num(it.protein,0); carb+=num(it.carb,0); fat+=num(it.fat,0); } });
    m.extras.forEach(ex=>{ if (ex){ cal+=num(ex.cal,0); protein+=num(ex.protein,0); carb+=num(ex.carb,0); fat+=num(ex.fat,0); } });
  });
  return { cal:Math.round(cal), protein:round1(protein), carb:round1(carb), fat:round1(fat) };
}

async function renderMeals(){
  const dateStr = isoDate(state.currentDate);
  if (!state.dayData || state.dayData.date !== dateStr) state.dayData = await loadDay(dateStr);
  const d = state.dayData;
  const dt = state.currentDate;
  const main = document.getElementById('main-content');

  let html = `<h2 style="font-size:17px;margin-bottom:10px;">Meals</h2>`;
  html += affirmHtml('meals');

  if (isNoMealDay(dt)){
    html += `<div class="rest-msg">Fasted all day — extended fast until Tuesday 10 AM.</div>`;
  } else {
    d.meals.forEach((m, mi) => {
      html += `<div class="meal-block"><h4>Meal ${mi+1}<span class="time">${m.time}</span></h4>`;
      m.items.forEach((it, ii) => {
        html += `<div class="food-item">
          <input type="checkbox" ${it.checked?'checked':''} onchange="toggleMealItem(${mi},${ii})">
          <div style="flex:1;">
            <div class="fi-name">${it.name}</div>
            <div class="fi-macro">${it.cal} cal · ${it.protein}g P · ${it.carb}g C · ${it.fat}g F</div>
          </div>
        </div>`;
      });
      m.extras.forEach((ex, ei) => {
        if (ex){
          html += `<div class="extra-row"><div class="extra-selected">
            <div><div class="fi-name">${ex.name}</div><div class="fi-macro">${ex.cal} cal · ${ex.protein}g P · ${ex.carb}g C · ${ex.fat}g F</div></div>
            <div class="rm" onclick="clearExtra(${mi},${ei})">remove</div>
          </div></div>`;
        } else {
          html += `<div class="extra-row">
            <input class="extra-search" placeholder="Add extra item…" oninput="searchFood(${mi},${ei}, this.value)" onfocus="searchFood(${mi},${ei}, this.value)">
            <div class="search-results" id="results-${mi}-${ei}" hidden></div>
          </div>`;
        }
      });
      html += `</div>`;
    });

    const totals = mealTotalsFor(d, dt);
    const pct = (v,t)=>Math.min(100, Math.round((v/t)*100));
    html += `<div class="totals-card">
      <h3 style="font-size:14px;margin-bottom:8px;">Daily Totals</h3>
      <div class="trow"><span>Calories</span><b>${totals.cal} / ${MEAL_TARGETS.cal}</b></div><div class="bar-bg"><div class="bar-fill" style="width:${pct(totals.cal,MEAL_TARGETS.cal)}%"></div></div>
      <div class="trow"><span>Protein</span><b>${totals.protein}g / ${MEAL_TARGETS.protein}g</b></div><div class="bar-bg"><div class="bar-fill" style="width:${pct(totals.protein,MEAL_TARGETS.protein)}%"></div></div>
      <div class="trow"><span>Carbs</span><b>${totals.carb}g / ${MEAL_TARGETS.carb}g</b></div><div class="bar-bg"><div class="bar-fill" style="width:${pct(totals.carb,MEAL_TARGETS.carb)}%"></div></div>
      <div class="trow"><span>Fat</span><b>${totals.fat}g / ${MEAL_TARGETS.fat}g</b></div><div class="bar-bg"><div class="bar-fill" style="width:${pct(totals.fat,MEAL_TARGETS.fat)}%"></div></div>
    </div>`;

    html += `<div class="field" style="margin-top:14px;"><label>Notes</label><textarea oninput="updateField('mealNotes', this.value)">${d.mealNotes}</textarea></div>`;
  }

  html += `<div class="link-row"><a href="#" onclick="selectTab('today');return false;">← Back to Today's Log</a><a href="#" onclick="selectTab('dashboard');return false;">View 90-Day Dashboard →</a></div>`;

  main.innerHTML = html;
  updateDateNav();
}
function toggleMealItem(mi, ii){
  const it = state.dayData.meals[mi].items[ii];
  it.checked = !it.checked;
  renderMeals(); scheduleSave();
}
function clearExtra(mi, ei){
  state.dayData.meals[mi].extras[ei] = null;
  renderMeals(); scheduleSave();
}
function searchFood(mi, ei, q){
  const box = document.getElementById(`results-${mi}-${ei}`);
  if (!q || q.trim()===''){ box.hidden = true; box.innerHTML=''; return; }
  const ql = q.trim().toLowerCase();
  const matches = FOOD_DB.filter(f => f.name.toLowerCase().includes(ql)).slice(0, 12);
  if (matches.length === 0){ box.hidden = true; return; }
  box.innerHTML = matches.map((f, idx) => `<div onclick="selectFood(${mi},${ei},${FOOD_DB.indexOf(f)})">${f.name} <span style="color:var(--ink-soft);">(${f.serving} · ${f.cal} cal)</span></div>`).join('');
  box.hidden = false;
}
function selectFood(mi, ei, foodIdx){
  const f = FOOD_DB[foodIdx];
  state.dayData.meals[mi].extras[ei] = { name:`${f.name} (${f.serving})`, cal:f.cal, protein:f.protein, carb:f.carb, fat:f.fat };
  renderMeals(); scheduleSave();
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
async function renderDashboard(){
  const main = document.getElementById('main-content');
  main.innerHTML = `<div style="padding:30px 0;text-align:center;color:var(--ink-soft);">Loading dashboard…</div>`;
  const allDays = await getAllDays();
  const startStr = await getProgramStart();
  const startDate = parseIso(startStr);
  const today = new Date();
  const daysElapsed = Math.max(1, Math.min(90, Math.floor((today - startDate)/86400000) + 1));
  const daysLogged = allDays.length;

  let trainingSessions=0, cardioWalks=0, totalSpend=0, businessWins=0, learningSessions=0, eveningJournals=0;
  let bestPush=0, bestPull=0;
  let calSum=0, proteinSum=0, carbSum=0, fatSum=0, mealDayCount=0;
  let waterSum=0, waterDayCount=0;
  const weightPoints = [];
  const dayMap = {};

  allDays.forEach(row => {
    const dt = parseIso(row.date);
    const dd = mergeDay(defaultDay(row.date), row.data);
    dayMap[row.date] = dd;
    if (dd.trained) trainingSessions++;
    if (dd.cardio && dd.cardio.completed) cardioWalks++;
    totalSpend += Object.values(dd.spend).reduce((a,b)=>a+num(b,0),0);
    if (dd.business && dd.business.win && dd.business.win.trim()) businessWins++;
    if (dd.learning && (dd.learning.source.trim() || dd.learning.insight.trim())) learningSessions++;
    if (dd.evening && dd.evening.journal && dd.evening.journal.trim()) eveningJournals++;
    bestPush = Math.max(bestPush, ...dd.push);
    bestPull = Math.max(bestPull, ...dd.pull);
    if (!isNoMealDay(dt)){
      const t = mealTotalsFor(dd, dt);
      if (t.cal > 0){ calSum+=t.cal; proteinSum+=t.protein; carbSum+=t.carb; fatSum+=t.fat; mealDayCount++; }
    }
    if (dd.water > 0){ waterSum += dd.water*12; waterDayCount++; }
    if (dow(dt) === 1 && dd.weight){ weightPoints.push({ date: row.date, weight: dd.weight }); }
  });
  weightPoints.sort((a,b)=>a.date.localeCompare(b.date));

  const avg = (sum,count)=> count>0 ? Math.round(sum/count) : 0;

  let html = `<h2 style="font-size:17px;margin-bottom:4px;">90-Day Dashboard</h2>`;
  html += `<div class="field" style="margin-top:10px;"><label>Program start date</label><input type="date" value="${startStr}" onchange="changeProgramStart(this.value)"></div>`;
  html += `<div style="font-size:13px;color:var(--ink-soft);">Day ${daysElapsed} of 90 · ${daysLogged} days logged</div>`;
  html += `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${Math.min(100,(daysElapsed/90)*100)}%"></div></div>`;

  html += `<div class="stat-grid">
    <div class="stat-tile"><div class="num">${trainingSessions}</div><div class="lbl">Training sessions</div></div>
    <div class="stat-tile"><div class="num">${cardioWalks}</div><div class="lbl">Cardio walks</div></div>
    <div class="stat-tile"><div class="num">${avg(proteinSum,mealDayCount)}g</div><div class="lbl">Avg protein/day</div></div>
    <div class="stat-tile"><div class="num">${avg(calSum,mealDayCount)}</div><div class="lbl">Avg calories/day</div></div>
    <div class="stat-tile"><div class="num">${avg(carbSum,mealDayCount)}g</div><div class="lbl">Avg carbs/day</div></div>
    <div class="stat-tile"><div class="num">${avg(fatSum,mealDayCount)}g</div><div class="lbl">Avg fat/day</div></div>
    <div class="stat-tile"><div class="num">${avg(waterSum,waterDayCount)}oz</div><div class="lbl">Avg water/day</div></div>
    <div class="stat-tile"><div class="num">$${Math.round(totalSpend)}</div><div class="lbl">Total spend</div></div>
    <div class="stat-tile"><div class="num">${businessWins}</div><div class="lbl">Business wins logged</div></div>
    <div class="stat-tile"><div class="num">${learningSessions}</div><div class="lbl">Learning sessions</div></div>
    <div class="stat-tile"><div class="num">${eveningJournals}</div><div class="lbl">Evening journals</div></div>
    <div class="stat-tile"><div class="num">${bestPush}</div><div class="lbl">Best push-up set</div></div>
    <div class="stat-tile"><div class="num">${bestPull}</div><div class="lbl">Best pull-up set</div></div>
  </div>`;

  // Weight trend
  html += `<h3 style="font-size:15px;margin:18px 0 8px;">Weight Trend (Mondays)</h3>`;
  if (weightPoints.length < 2){
    html += `<div class="rest-msg">Not enough Monday weigh-ins yet to chart a trend.</div>`;
  } else {
    const w = 340, h = 120, pad = 20;
    const weights = weightPoints.map(p=>p.weight);
    const minW = Math.min(...weights), maxW = Math.max(...weights);
    const range = (maxW-minW) || 1;
    const stepX = (w-2*pad)/(weightPoints.length-1);
    const pts = weightPoints.map((p,i)=>{
      const x = pad + i*stepX;
      const y = h-pad - ((p.weight-minW)/range)*(h-2*pad);
      return `${x},${y}`;
    });
    html += `<div class="card"><div class="card-body" style="padding-top:14px;">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--rose)" stroke-width="2.5"/>
        ${pts.map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--rose)"/>`}).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;">
        <span>${weightPoints[0].weight} lbs</span><span>${weightPoints[weightPoints.length-1].weight} lbs</span>
      </div>
    </div></div>`;
  }

  // Heatmap
  html += `<h3 style="font-size:15px;margin:18px 0 8px;">90-Day Training Heatmap</h3>`;
  let cells = '';
  for (let i=0;i<91;i++){
    const cd = new Date(startDate); cd.setDate(cd.getDate()+i);
    const cdStr = isoDate(cd);
    let color = '#EDE9DC'; // upcoming
    if (cd <= today){
      if (isRestDay(cd)) color = 'var(--gold)';
      else if (dayMap[cdStr] && dayMap[cdStr].trained) color = 'var(--moss)';
      else color = 'var(--rose)';
    }
    cells += `<div class="heat-cell" style="background:${color}" title="${cdStr}"></div>`;
  }
  html += `<div class="heatmap-grid">${cells}</div>`;
  html += `<div class="legend">
    <span><i style="background:var(--moss)"></i>Trained</span>
    <span><i style="background:var(--gold)"></i>Rest day</span>
    <span><i style="background:var(--rose)"></i>Missed</span>
    <span><i style="background:#EDE9DC"></i>Upcoming</span>
  </div>`;

  html += `<div class="signout-link" onclick="sb.auth.signOut()">Sign out</div>`;

  main.innerHTML = html;
  updateDateNav();
}
async function changeProgramStart(val){
  await setProgramStart(val);
  await renderDashboard();
}
</script>
</body>
</html>
