<html lang="en">

<style>
  :root{
    --cream:#F6F3EA;
    --card:#FFFFFF;
    --sage:#5B84A8;
    --sage-dark:#3F6A8C;
    --moss:#2C4A66;
    --gold:#C79A45;
    --rose:#C17B87;
    --teal:#3F7896;
    --taupe:#948C77;
    --french:#5B7DB1;
    --french-bg:#F0F3FA;
    --ink:#2B2B26;
    --ink-soft:#6B675C;
    --border:#E4DFCF;
    --danger:#B0473F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3,h4{font-family:'Archivo Expanded',sans-serif;letter-spacing:.01em;color:var(--ink);margin:0;}
  input,textarea,select,button{font-family:inherit;font-size:16px;}
  a{color:var(--sage-dark);}

  #app-shell{max-width:520px;margin:0 auto;padding-bottom:90px;min-height:100vh;}
  header.top{position:sticky;top:0;z-index:20;background:var(--cream);padding:14px 16px 8px;border-bottom:1px solid var(--border);}
  header.top h1{font-size:19px;}
  .tabs{display:flex;gap:6px;margin-top:12px;}
  .tab-btn{flex:1;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;}
  .navbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:17px;cursor:pointer;color:var(--ink);}
  .date-label{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .today-btn{background:var(--card);border:1px solid var(--sage);color:var(--sage-dark);border-radius:10px;padding:0 12px;height:40px;font-size:13px;font-weight:600;cursor:pointer;}
  main{padding:14px 16px 40px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;}
  .card-header .title-wrap{display:flex;align-items:center;gap:8px;}
  .card-header .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .card-header h3{font-size:15.5px;}
  .card-header .chev{color:var(--ink-soft);transition:transform .15s;font-size:13px;}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card-body{padding:0 16px 16px;}
  .card.collapsed .card-body{display:none;}
  .card.french-card{background:var(--french-bg);border-color:#D4DDF0;}
  .card.french-card .card-header h3{color:var(--french);}

  .affirm{font-size:12.5px;font-style:italic;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
  .affirm div{margin-bottom:3px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:#FDFCF8;color:var(--ink);font-size:16px;}
  .field textarea{min-height:66px;resize:vertical;line-height:1.45;}
  .field .msg{font-size:14px;color:var(--ink-soft);font-style:italic;padding:8px 0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .label{font-size:14px;}
  .toggle-row .sub{font-size:11.5px;color:var(--ink-soft);}
  .switch{width:46px;height:27px;border-radius:999px;background:#E1DCC9;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;border:none;}
  .switch.on{background:var(--sage);}
  .switch .knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on .knob{left:22px;}

  .rest-msg{background:#FBF7EC;border:1px dashed var(--gold);border-radius:10px;padding:16px;text-align:center;color:#8a6b28;font-size:14px;font-weight:600;}
  .info-note{background:#FBF7EC;border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font-size:13px;color:#8a6b28;margin:10px 0;line-height:1.45;}

  .dots-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;}
  .water-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--teal);background:transparent;cursor:pointer;flex-shrink:0;}
  .water-dot.filled{background:var(--teal);}
  .water-sub{font-size:12px;color:var(--ink-soft);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:#FDFCF8;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  .chip.selected{background:var(--taupe);color:#fff;border-color:var(--taupe);}
  .chip.fr.selected{background:var(--french);border-color:var(--french);}
  .chip.cardio.selected{background:var(--teal);border-color:var(--teal);}

  .ex-card{border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:11px;background:#FDFCF8;}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ex-name{font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;}
  .ex-target{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .ex-note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.4;overflow-wrap:anywhere;}
  .ex-last{font-size:12px;color:var(--sage-dark);margin-top:6px;font-family:'IBM Plex Mono',monospace;overflow-wrap:anywhere;}
  .ex-nudge{font-size:12.5px;color:#8a6b28;background:#FBF7EC;border-radius:7px;padding:6px 9px;margin-top:6px;}
  .ex-actions{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{background:#fff;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .mini-btn.danger{color:var(--danger);}
  .set-row{display:flex;align-items:center;gap:8px;margin-top:7px;}
  .set-row .set-lbl{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;width:40px;flex-shrink:0;}
  .set-row input{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:16px;}
  .add-ex-btn{width:100%;padding:11px;border:1px dashed var(--sage);background:transparent;color:var(--sage-dark);border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}

  .meal-block{margin-bottom:18px;}
  .meal-block h4{font-size:14.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .meal-block h4 .time{color:var(--ink-soft);font-size:12px;font-weight:500;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
  .food-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .food-item:last-child{border-bottom:none;}
  .food-item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--sage);flex-shrink:0;}
  .fi-body{flex:1;min-width:0;}
  .fi-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere;white-space:normal;}
  .fi-macro{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;overflow-wrap:anywhere;}
  .fish-select{margin-top:6px;width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:15px;}
  .extra-row{position:relative;padding:8px 0;border-bottom:1px solid var(--border);}
  .extra-row:last-child{border-bottom:none;}
  .extra-search{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#FDFCF8;font-size:16px;}
  .extra-selected{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 2px;}
  .extra-selected .rm{color:var(--danger);cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;}
  .search-results{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:210px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.1);}
  .search-results div{padding:10px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
  .search-results div:last-child{border-bottom:none;}

  .totals-card{background:#FBF9F1;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .totals-card .trow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .totals-card .trow b{font-family:'IBM Plex Mono',monospace;}
  .bar-bg{height:7px;background:var(--border);border-radius:99px;margin-top:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--sage);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .stat-tile .num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat-tile .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
  .progress-bar-bg{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0;}
  .progress-bar-fill{height:100%;background:var(--sage);}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .heat-cell{aspect-ratio:1;border-radius:3px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .lift-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .lift-row:last-child{border-bottom:none;}
  .lift-row .lname{flex:1;min-width:0;overflow-wrap:anywhere;}
  .lift-row .lval{font-family:'IBM Plex Mono',monospace;flex-shrink:0;color:var(--ink-soft);}

  .fr-head{display:flex;gap:10px;margin-bottom:12px;}
  .fr-pill{flex:1;background:#fff;border:1px solid #D4DDF0;border-radius:10px;padding:10px;text-align:center;}
  .fr-pill .big{font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--french);}
  .fr-pill .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .word-card{background:#fff;border:1px solid #D4DDF0;border-radius:11px;padding:14px;text-align:center;margin-bottom:12px;}
  .word-fr{font-family:'Archivo Expanded',sans-serif;font-size:22px;color:var(--french);line-height:1.25;overflow-wrap:anywhere;}
  .word-en{font-size:14px;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere;}
  .fr-affirm{background:#fff;border:1px solid #D4DDF0;border-radius:11px;padding:12px;margin-bottom:12px;}
  .fr-affirm .fr-line{font-size:15px;font-style:italic;color:var(--french);line-height:1.45;overflow-wrap:anywhere;}
  .fr-affirm .en-line{font-size:12.5px;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere;}
  .numbers-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin-top:8px;}
  .numbers-grid div{font-size:13.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .word-list div{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 26px;max-width:360px;width:100%;}
  .login-card h1{font-size:20px;margin-bottom:6px;}
  .login-card p{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .login-card button.submit{width:100%;padding:13px;border:none;border-radius:10px;background:var(--sage);color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}

  .save-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;padding:11px 16px;box-shadow:0 -4px 14px rgba(0,0,0,.15);}
  .save-bar .status{font-size:13px;}
  .save-bar .status.err{color:#FFB4AE;}
  .save-bar button{background:var(--sage);color:#fff;border:none;border-radius:9px;padding:9px 20px;font-weight:600;font-size:14px;cursor:pointer;}
  .signout-link{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline;}
  .build-tag{text-align:center;font-size:10px;color:var(--ink-soft);margin-top:10px;font-family:'IBM Plex Mono',monospace;}
  .link-row{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13.5px;}
  [hidden]{display:none!important;}
</style>
</head>

<div id="login-screen">
  <div class="login-card">
    <h1>90-Day Tracker</h1>
    <p>Sign in to continue.</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button class="submit" type="submit">Sign In</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<div id="app-shell" hidden>
  <header class="top">
    <h1>90-Day Wellness Prep</h1>
    <div class="tabs">
      <button class="tab-btn" data-tab="today">Today's Log</button>
      <button class="tab-btn" data-tab="meals">Meals</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </div>
    <div class="date-nav" id="date-nav">
      <button class="navbtn" id="prev-day">&lsaquo;</button>
      <div class="date-label" id="date-label"></div>
      <button class="navbtn" id="next-day">&rsaquo;</button>
      <button class="today-btn" id="today-btn">Today</button>
    </div>
  </header>
  <main id="main-content"></main>
</div>

<div class="save-bar" id="save-bar" hidden>
  <span class="status" id="save-status">Unsaved changes</span>
  <button id="save-btn" onclick="saveNow()">Save</button>
</div>

/* =========================================================================
   HELPERS
   ========================================================================= */
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function parseIso(s){ const p=String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function dow(x){ return (typeof x === 'string' ? parseIso(x) : x).getDay(); }
function isRestDay(d){ return dow(d)===6; }
function isMonday(d){ return dow(d)===1; }
function num(v, fb){ const n = Number(v); return isFinite(n) ? n : fb; }
function round1(n){ return Math.round(n*10)/10; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDateLabel(d){
  let lbl = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  if (isoDate(d) === isoDate(new Date())) lbl += ' (Today)';
  return lbl;
}
function eatingWindow(d){
  const x = dow(d);
  if (x === 1) return { open:'16:00', close:'18:30' };   // Monday: fast ends 4 PM
  if (x === 0) return { open:'10:00', close:'18:00' };   // Sunday: closes early
  return { open:'10:00', close:'18:30' };                // Tue–Sat
}
function sessionFor(d){ return TRAINING_PROGRAM[dow(d)]; }

/* program week / phase */
function programDayNumber(dateStr){
  if (!state.programStart) return 1;
  const diff = Math.floor((parseIso(dateStr) - parseIso(state.programStart))/86400000);
  return diff + 1;
}
function programWeek(dateStr){
  const d = programDayNumber(dateStr);
  return Math.max(1, Math.ceil(d/7));
}
function phaseName(week){
  if (week <= 2) return 'Calibration';
  if (week <= 7) return 'Progression';
  if (week === 8) return 'Recovery week';
  return 'Hold strength';
}
function cardioPlan(week){
  if (week <= 4) return { sessions:3, range:'15–20 min', days:[3,4,0] };
  if (week <= 8) return { sessions:4, range:'20–25 min', days:[3,4,0,1] };
  return { sessions:5, range:'25–30 min', days:[3,4,0,1,5] };
}

/* seeded shuffle affirmations */
function hashStr(s){
  let h = 1779033703 ^ s.length;
  for (let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return (h ^ h>>>16)>>>0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const a = arr.slice(); const rand = mulberry32(seed);
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function dayIndexFor(dateStr){ return Math.round((parseIso(dateStr) - new Date(2020,0,1))/86400000); }
function pickFromPool(pool, count, category, dateStr){
  const len = pool.length; let offset = dayIndexFor(dateStr)*count; const out = [];
  while (out.length < count){
    const cycle = Math.floor(offset/len), idx = ((offset % len)+len)%len;
    out.push(seededShuffle(pool, hashStr(category+':'+cycle))[idx]);
    offset++;
  }
  return out;
}
function getAffirmations(category, dateStr){ return pickFromPool(AFFIRMATIONS[category], AFFIRM_COUNTS[category], category, dateStr); }
function affirmHtml(category){
  return '<div class="affirm">' + getAffirmations(category, isoDate(state.currentDate)).map(a=>'<div>"'+esc(a)+'"</div>').join('') + '</div>';
}

function defaultMealsFor(dateStr){
  const tpl = isMonday(dateStr) ? MEALS_MONDAY : MEALS_TUE_SUN;
  const sunday = dow(dateStr) === 0;
  const built = tpl.map(m => ({
    name: m.name,
    time: (sunday && m.name === 'Meal 5') ? '5:30 PM' : m.time,
    items: m.items.map(it => ({
      name: it.name, cal: it.cal, protein: it.protein, carb: it.carb, fat: it.fat,
      checked: false,
      isFish: !!it.isFish,
      fishType: it.isFish ? 'Grouper' : undefined
    })),
    extras: [null,null,null]
  }));
  built.forEach(m=>m.items.forEach(it=>{ if (it.isFish) applyFish(it); }));
  return built;
}
function defaultExercisesFor(dateStr){
  const s = sessionFor(dateStr);
  if (!s || !s.exercises.length) return [];
  return s.exercises.map(ex => ({
    exerciseName: ex.name,
    group: ex.group,
    targetSets: ex.sets,
    targetReps: ex.reps,
    repTop: ex.repTop || null,
    note: ex.note || '',
    suggested: ex.suggested || '',
    repsOnly: !!ex.repsOnly,
    swappedFrom: null,
    added: false,
    sets: Array.from({length: ex.sets}, ()=>({weight:'', reps:''}))
  }));
}

    meals: defaultMealsFor(dateStr),
    mealNotes: '',
    spend: { food:0, supplements:0, gym:0, business:0, other:0 },
    learning: { entries: [ {type:'',title:'',insight:'',minutes:''}, {type:'',title:'',insight:'',minutes:''} ] },
    french: { minutes:'', methods:[], newWords:[{fr:'',en:''},{fr:'',en:''},{fr:'',en:''}], savedWordOfDay:false, challengeDone:false },
    business: { win:'', revenue:'', nextStep:'' },

  };
}

/* =========================================================================
   MERGE — loads old saved days onto the new template without data loss
   ========================================================================= */
function mergeDay(base, saved){
  if (!saved || typeof saved !== 'object') return base;
  const out = JSON.parse(JSON.stringify(base));
  const legacy = {};

  ['weight','energy','sleep','cycleNotes','trained','feel','mealNotes','sessionKey'].forEach(k=>{
    if (saved[k] !== undefined) out[k] = saved[k];
  });
  ['creatine','aminos','vitamins'].forEach(k=>{ if (saved[k] !== undefined) out[k] = !!saved[k]; });

  /* water: new waterOz, or old 12oz-dot count */
  if (saved.waterOz !== undefined) out.waterOz = num(saved.waterOz, 0);
  else if (saved.water !== undefined) out.waterOz = num(saved.water, 0) * 12;

  /* cardio: new shape, or old walk-based shape */
  if (saved.cardio && typeof saved.cardio === 'object'){
    const c = saved.cardio;
    if (c.stairDone !== undefined || c.stairMinutes !== undefined){
      out.cardio = {
        stairDone: !!c.stairDone,
        stairMinutes: c.stairMinutes || '',
        intensity: c.intensity || '',
        steps: c.steps || '',
        walkMinutes: c.walkMinutes || ''
      };
    } else {
      out.cardio.walkMinutes = c.duration || '';
      out.cardio.steps = c.steps || '';
      if (c.route) legacy.cardioRoute = c.route;
      if (c.completed) legacy.cardioWalkCompleted = true;
    }
  }

  if (saved.spend) out.spend = {
    food:num(saved.spend.food,0), supplements:num(saved.spend.supplements,0), gym:num(saved.spend.gym,0),
    business:num(saved.spend.business,0), other:num(saved.spend.other,0)
  };
  if (saved.business) out.business = {
    win: saved.business.win||'', revenue: saved.business.revenue||'', nextStep: saved.business.nextStep||''
  };
  if (saved.evening) out.evening = {
    practices: Object.assign({mirror:false,reverseJournal:false,imagine:false,silence:false,patterns:false}, saved.evening.practices||{}),
    practiceNote: saved.evening.practiceNote||'', journal: saved.evening.journal||''
  };

  /* learning: new entries array, or old single {source,insight,amount} */
  if (saved.learning && Array.isArray(saved.learning.entries)){
    out.learning.entries = [0,1].map(i=>{
      const e = saved.learning.entries[i] || {};
      return { type:e.type||'', title:e.title||'', insight:e.insight||'', minutes:e.minutes||'' };
    });
  } else if (saved.learning && (saved.learning.source || saved.learning.insight || saved.learning.amount)){
    out.learning.entries[0] = {
      type:'', title: saved.learning.source||'', insight: saved.learning.insight||'', minutes: saved.learning.amount||''
    };
  }

  /* french */
  if (saved.french){
    const f = saved.french;
    out.french = {
      minutes: f.minutes || '',
      methods: Array.isArray(f.methods) ? f.methods.slice() : [],
      newWords: [0,1,2].map(i=>{ const w = (f.newWords||[])[i]||{}; return {fr:w.fr||'', en:w.en||''}; }),
      savedWordOfDay: !!f.savedWordOfDay,
      challengeDone: !!f.challengeDone
    };
  }

  /* training exercises: new per-set shape, or old manual rows + push/pull arrays */
  if (Array.isArray(saved.exercises) && saved.exercises.length && saved.exercises[0] && saved.exercises[0].exerciseName !== undefined){
    out.exercises = saved.exercises.map(e=>({
      exerciseName: e.exerciseName || '',
      group: e.group || '',
      targetSets: num(e.targetSets, (e.sets||[]).length || 3),
      targetReps: e.targetReps || '',
      repTop: e.repTop === undefined ? null : e.repTop,
      note: e.note || '',
      suggested: e.suggested || '',
      repsOnly: !!e.repsOnly,
      swappedFrom: e.swappedFrom || null,
      added: !!e.added,
      sets: Array.isArray(e.sets) ? e.sets.map(s=>({weight: s.weight||'', reps: s.reps||''})) : []
    }));
  } else {
    /* old format: exercises [{name,sets,reps,weight}] + push[]/pull[] */
    const oldRows = Array.isArray(saved.exercises) ? saved.exercises.filter(r=>r && (r.name||r.sets||r.reps||r.weight)) : [];
    if (oldRows.length) legacy.oldExerciseRows = oldRows;
    const push = Array.isArray(saved.push) ? saved.push.filter(n=>num(n,0)>0) : [];
    const pull = Array.isArray(saved.pull) ? saved.pull.filter(n=>num(n,0)>0) : [];
    if (push.length){
      const target = out.exercises.find(e=>e.exerciseName === 'Push-ups');
      if (target) push.forEach((r,i)=>{ if (target.sets[i]) target.sets[i].reps = String(r); });
      else legacy.oldPushUps = push;
    }
    if (pull.length){
      const target = out.exercises.find(e=>e.exerciseName.indexOf('Pull-ups') === 0);
      if (target) pull.forEach((r,i)=>{ if (target.sets[i]) target.sets[i].reps = String(r); });
      else legacy.oldPullUps = pull;
    }
  }

  /* meals: carry checked state by matching name, carry extras by index */
  if (Array.isArray(saved.meals)){
    let namesMatched = 0, oldChecked = 0;
    const savedByName = {};
    saved.meals.forEach(m=>{
      (Array.isArray(m && m.items) ? m.items : []).forEach(it=>{
        if (it && it.name){ savedByName[it.name] = it; if (it.checked) oldChecked++; }
      });
    });
    out.meals.forEach((meal, mi)=>{
      const savedMeal = saved.meals[mi];
      const savedItems = savedMeal && Array.isArray(savedMeal.items) ? savedMeal.items : [];
      meal.items.forEach(item=>{
        if (item.isFish){
          /* Fish items are renamed to the chosen species, so they never match by name.
             Find the fish row in the same meal instead, in either format. */
          const fm = savedItems.find(si=>si && (si.isFish || fishTypeFromName(si.name)));
          if (fm){
            namesMatched++;
            item.checked = fm.checked !== undefined ? !!fm.checked : false;
            const ft = (fm.fishType && FISH_OPTIONS[fm.fishType]) ? fm.fishType : fishTypeFromName(fm.name);
            if (ft) item.fishType = ft;
          }
          return;
        }
        const match = savedByName[item.name];
        if (match){
          namesMatched++;
          item.checked = match.checked !== undefined ? !!match.checked : false;
        }
      });
      const sm = saved.meals[mi];
      if (sm && Array.isArray(sm.extras)){
        meal.extras = [0,1,2].map(ei=>{
          const e = sm.extras[ei];
          if (!e || !e.name) return null;
          return { name:e.name, cal:num(e.cal,0), protein:num(e.protein,0), carb:num(e.carb,0), fat:num(e.fat,0) };
        });
      }
    });
    /* if the old day had checked items that no longer exist in the template, keep the raw record */
    if (oldChecked > namesMatched) legacy.oldMeals = saved.meals;
  }

  if (saved.legacy) Object.assign(legacy, saved.legacy);
  if (Object.keys(legacy).length) out.legacy = legacy;
  /* recompute fish macros after merge */
  out.meals.forEach(m=>m.items.forEach(it=>{ if (it.isFish) applyFish(it); }));
  return out;
}
function fishTypeFromName(name){
  if (!name) return null;
  const n = String(name).toLowerCase();
  const keys = Object.keys(FISH_OPTIONS);
  for (let i=0;i<keys.length;i++){ if (n.indexOf(keys[i].toLowerCase()) !== -1) return keys[i]; }
  return null;
}
function applyFish(item){
  const f = FISH_OPTIONS[item.fishType] || FISH_OPTIONS['Grouper'];
  item.cal=f.cal; item.protein=f.protein; item.carb=f.carb; item.fat=f.fat;
  item.name = '5oz ' + (item.fishType||'Grouper').toLowerCase() + ', cooked';
}

/* =========================================================================
   SUPABASE DATA ACCESS
   ========================================================================= */
async function loadDay(dateStr){
  const base = defaultDay(dateStr);
  const res = await sb.from('days').select('data').eq('user_id', state.userId).eq('date', dateStr).maybeSingle();
  if (res.error){ console.error(res.error); return base; }
  return res.data && res.data.data ? mergeDay(base, res.data.data) : base;
}
function scheduleSave(){
  state.dirty = true;
  setSaveState('unsaved');
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(saveCurrentDay, 800);
}
async function saveCurrentDay(){
  if (!state.dayData || !state.userId) return;
  clearTimeout(state.saveTimer);
  setSaveState('saving');
  const dateStr = isoDate(state.currentDate);
  const res = await sb.from('days').upsert({
    user_id: state.userId, date: dateStr, data: state.dayData, updated_at: new Date().toISOString()
  }, { onConflict: 'user_id,date' });
  if (res.error){ console.error(res.error); setSaveState('error'); return false; }
  state.dirty = false;
  state.allDaysCache = null;
  state.recentDaysCache = null;
  setSaveState('saved');
  return true;
}
async function saveNow(){ await saveCurrentDay(); }
async function flushPendingSave(){ if (state.dirty) await saveCurrentDay(); }
let savedHideTimer;
function setSaveState(s){
  state.saveState = s;
  const bar = document.getElementById('save-bar');
  const st = document.getElementById('save-status');
  const btn = document.getElementById('save-btn');
  if (!bar || !st || !btn) return;
  clearTimeout(savedHideTimer);
  st.classList.remove('err');
  if (s === 'idle'){ bar.hidden = true; return; }
  bar.hidden = false;
  if (s === 'unsaved'){ st.textContent = 'Unsaved changes'; btn.textContent = 'Save'; btn.hidden = false; }
  else if (s === 'saving'){ st.textContent = 'Saving…'; btn.hidden = true; }
  else if (s === 'saved'){
    st.textContent = 'Saved'; btn.hidden = true;
    savedHideTimer = setTimeout(()=>{ if (state.saveState==='saved'){ bar.hidden = true; state.saveState='idle'; } }, 1500);
  }
  else if (s === 'error'){ st.textContent = "Couldn't save"; st.classList.add('err'); btn.textContent = 'Retry'; btn.hidden = false; }
}
async function getSetting(key, fallback){
  const res = await sb.from('app_settings').select('value').eq('user_id', state.userId).eq('key', key).maybeSingle();
  if (res.error || !res.data) return fallback;
  return res.data.value === undefined ? fallback : res.data.value;
}
async function setSetting(key, value){
  await sb.from('app_settings').upsert({ user_id: state.userId, key: key, value: value }, { onConflict:'user_id,key' });
}
async function loadSettings(){
  const ps = await getSetting('programStart', null);
  if (ps && ps.date) state.programStart = ps.date;
  else { state.programStart = isoDate(new Date()); await setSetting('programStart', {date: state.programStart}); }
  const goal = await getSetting('frenchWeeklyGoal', null);
  state.frenchWeeklyGoal = goal && goal.minutes ? num(goal.minutes, 90) : 90;
  const words = await getSetting('frenchWords', null);
  state.frenchWords = words && Array.isArray(words.list) ? words.list : [];
}
async function saveFrenchWords(){ await setSetting('frenchWords', {list: state.frenchWords}); }
async function getAllDays(){
  if (state.allDaysCache) return state.allDaysCache;
  const res = await sb.from('days').select('date,data').eq('user_id', state.userId).order('date');
  if (res.error){ console.error(res.error); return []; }
  state.allDaysCache = res.data || [];
  return state.allDaysCache;
}
/* last 30 days, fetched once per session, used for "Last time" + French streak */
async function getRecentDays(){
  if (state.recentDaysCache) return state.recentDaysCache;
  const res = await sb.from('days').select('date,data').eq('user_id', state.userId).order('date', {ascending:false}).limit(30);
  if (res.error){ console.error(res.error); return []; }
  state.recentDaysCache = res.data || [];
  return state.recentDaysCache;
}

  state.userId = null; state.allDaysCache = null; state.recentDaysCache = null;
  state.dayData = null; state.programStart = null;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('app-shell').hidden = true;

  const res = await sb.auth.getSession();
  if (res.data && res.data.session) onLogin(res.data.session.user);
  sb.auth.onAuthStateChange((event, session)=>{
    if (event === 'SIGNED_IN' && session) onLogin(session.user);
    if (event === 'SIGNED_OUT') onLogout();
  });
}

}
async function ensureDay(){
  const dateStr = isoDate(state.currentDate);
  if (!state.dayData || state.dayData.date !== dateStr) state.dayData = await loadDay(dateStr);
  return state.dayData;
}

/* =========================================================================
   CARD SHELL
   ========================================================================= */
function cardShell(id, dotColor, title, bodyHtml, extraClass){

}
function toggleCard(id){

  const el = document.getElementById('card-'+id);
  if (el) el.classList.toggle('collapsed');
}
function switchHtml(id, on, fn){
  return '<button class="switch '+(on?'on':'')+'" id="'+id+'" onclick="'+fn+'"><span class="knob"></span></button>';
}
function numInput(value, handler, placeholder, whole){
  return '<input type="text" inputmode="'+(whole?'numeric':'decimal')+'" value="'+esc(value==null?'':value)+'" placeholder="'+esc(placeholder||'')+'" oninput="'+handler+'">';
}

/* =========================================================================
   DAWN ARC
   ========================================================================= */
function dawnArcSvg(d){
  const W=358, H=54, y=20, h=14, total=24*60;
  const x = m => (m/total)*W;
  const segs = [{f:0,t:total,c:'#EDE9DC'}];
  const x0 = dow(d);
  if (!isRestDay(d)) segs.push({f:4*60,t:5*60+30,c:'var(--moss)'});
  const win = eatingWindow(d);
  const op = win.open.split(':').map(Number), cl = win.close.split(':').map(Number);
  const openMin = op[0]*60+op[1], closeMin = cl[0]*60+cl[1];
  segs.push({f:openMin,t:closeMin,c:'var(--sage)'});
  /* weekly fast: Sunday 6PM->midnight, Monday midnight->4PM */
  if (x0 === 0) segs.push({f:closeMin,t:total,c:'var(--rose)'});
  if (x0 === 1) segs.push({f:0,t:openMin,c:'var(--rose)'});
  let rects = segs.map(s=>'<rect x="'+x(s.f)+'" y="'+y+'" width="'+(x(s.t)-x(s.f))+'" height="'+h+'" fill="'+s.c+'" rx="3"/>').join('');
  let marker = '';
  if (isoDate(d) === isoDate(new Date())){
    const now = new Date(), nm = now.getHours()*60+now.getMinutes(), px = x(nm);
    marker = '<line x1="'+px+'" y1="'+(y-4)+'" x2="'+px+'" y2="'+(y+h+4)+'" stroke="var(--gold)" stroke-width="2"/><circle cx="'+px+'" cy="'+(y-6)+'" r="4" fill="var(--gold)"/>';
  }
  const labels = [0,6,12,18,24].map(hr=>'<text x="'+x(hr*60)+'" y="'+(y+h+16)+'" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+hr+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+rects+marker+labels+'</svg>';
}
function statusLine(d){
  if (isoDate(d) !== isoDate(new Date())) return fmtDateLabel(d);
  const now = new Date(), nm = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const x0 = dow(d), win = eatingWindow(d);
  const op = win.open.split(':').map(Number), cl = win.close.split(':').map(Number);
  const openMin = op[0]*60+op[1], closeMin = cl[0]*60+cl[1];
  const ev = [];
  if (x0 === 1) ev.push([0,'Weekly fast']);
  if (!isRestDay(d)){ ev.push([4*60,'Training']); ev.push([5*60+30, x0===1 ? 'Weekly fast' : 'Fasted']); }
  ev.push([openMin,'Eating window']);
  ev.push([closeMin, x0===0 ? 'Weekly fast begins' : 'Fasting']);
  ev.sort((a,b)=>a[0]-b[0]);
  let cur = ev[ev.length-1];
  for (const e of ev) if (e[0] <= nm) cur = e;
  let next = ev.find(e=>e[0] > nm);
  if (!next) next = [24*60 + ev[0][0], ev[0][1]];
  const hrs = round1((next[0]-nm)/60);
  const label = (cur[1]==='Weekly fast' || cur[1]==='Fasting' || cur[1]==='Fasted') ? (cur[1]+' · '+hrs+'h until you eat') : (cur[1]+' · '+hrs+'h remaining');
  return label;
}

/* =========================================================================
   "LAST TIME" LOOKUP + PROGRESSION
   ========================================================================= */
function lastTimeFor(exerciseName, currentDateStr){
  const rows = state.recentDaysCache || [];
  for (const row of rows){
    if (row.date >= currentDateStr) continue;
    const dd = row.data;
    if (!dd || !Array.isArray(dd.exercises)) continue;
    const ex = dd.exercises.find(e=>e && e.exerciseName === exerciseName);
    if (!ex || !Array.isArray(ex.sets)) continue;
    const logged = ex.sets.filter(s=>s && (String(s.reps).trim() !== ''));
    if (!logged.length) continue;
    return { date: row.date, sets: logged, repsOnly: !!ex.repsOnly };
  }
  return null;
}
function lastTimeText(lt){
  if (!lt) return '';
  const reps = lt.sets.map(s=>s.reps).join(', ');
  const w = lt.sets[0] && String(lt.sets[0].weight).trim();
  return lt.repsOnly || !w ? ('Last time: ' + reps + ' reps') : ('Last time: ' + w + ' lb × ' + reps);
}
function progressionNudge(ex, lt){
  if (!lt || ex.repsOnly || !ex.repTop) return '';
  const allTop = lt.sets.length >= (ex.targetSets||lt.sets.length) && lt.sets.every(s=>num(s.reps,0) >= ex.repTop);
  if (!allTop) return '';
  const s = sessionFor(state.currentDate);
  const inc = (s && s.body === 'upper') ? '+2.5–5 lb' : '+5–10 lb';
  return '<div class="ex-nudge">Ready to go up: '+inc+'</div>';
}

/* =========================================================================
   MEAL TOTALS
   ========================================================================= */
function mealTotals(d){
  let cal=0,protein=0,carb=0,fat=0;
  (d.meals||[]).forEach(m=>{
    m.items.forEach(it=>{ if (it.checked){ cal+=num(it.cal,0); protein+=num(it.protein,0); carb+=num(it.carb,0); fat+=num(it.fat,0); } });
    m.extras.forEach(e=>{ if (e){ cal+=num(e.cal,0); protein+=num(e.protein,0); carb+=num(e.carb,0); fat+=num(e.fat,0); } });
  });
  return { cal:Math.round(cal), protein:round1(protein), carb:round1(carb), fat:round1(fat) };
}
function targetsFor(dateStr){ return isMonday(dateStr) ? TARGETS_MONDAY : TARGETS_TUE_SUN; }
function salmonToday(d){ return (d.meals||[]).some(m=>m.items.some(it=>it.isFish && it.fishType === 'Salmon')); }

/* =========================================================================
   FRENCH HELPERS
   ========================================================================= */
function frenchLevel(totalMinutes){
  let cur = FRENCH_LEVELS[0], next = null;
  for (let i=0;i<FRENCH_LEVELS.length;i++){
    if (totalMinutes >= FRENCH_LEVELS[i].min) cur = FRENCH_LEVELS[i];
  }
  const idx = FRENCH_LEVELS.indexOf(cur);
  if (idx < FRENCH_LEVELS.length-1) next = FRENCH_LEVELS[idx+1];
  return { current: cur, next: next };
}
function wordOfDay(dateStr){
  const n = programDayNumber(dateStr);
  const idx = ((n-1) % FRENCH_WORDS.length + FRENCH_WORDS.length) % FRENCH_WORDS.length;
  return FRENCH_WORDS[idx];
}
function frenchAffirmOfDay(dateStr){ return pickFromPool(FRENCH_AFFIRMATIONS, 1, 'french-affirm', dateStr)[0]; }
function challengeOfDay(dateStr){ return pickFromPool(FRENCH_CHALLENGES, 1, 'french-challenge', dateStr)[0]; }
function frenchStreak(rows, todayStr){
  const byDate = {};
  rows.forEach(r=>{ if (r.data && r.data.french && num(r.data.french.minutes,0) > 0) byDate[r.date] = true; });
  if (state.dayData && state.dayData.french && num(state.dayData.french.minutes,0) > 0) byDate[state.dayData.date] = true;
  let streak = 0;
  const cursor = parseIso(todayStr);
  if (!byDate[isoDate(cursor)]) cursor.setDate(cursor.getDate()-1);
  while (byDate[isoDate(cursor)]){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function frenchMinutesThisWeek(rows, dateStr){
  const d = parseIso(dateStr);
  const monday = new Date(d);
  const shift = (d.getDay() + 6) % 7;
  monday.setDate(d.getDate() - shift);
  let total = 0;
  rows.forEach(r=>{
    const rd = parseIso(r.date);
    if (rd >= monday && rd <= d && r.data && r.data.french) total += num(r.data.french.minutes, 0);
  });
  if (state.dayData && state.dayData.french){
    const cd = parseIso(state.dayData.date);
    if (cd >= monday && cd <= d){
      const already = rows.find(r=>r.date === state.dayData.date);
      if (already && already.data && already.data.french) total -= num(already.data.french.minutes,0);
      total += num(state.dayData.french.minutes, 0);
    }
  }
  return Math.round(total);
}

    + '<div class="field"><label>Win of the day</label><textarea oninput="updateNested(\'business\',\'win\',this.value)">'+esc(d.business.win)+'</textarea></div>'
    + '<div class="field"><label>Revenue / opportunity ($)</label>'+numInput(d.business.revenue, "updateNested('business','revenue',this.value)", '$')+'</div>'
    + '<div class="field"><label>Next step tomorrow</label><textarea oninput="updateNested(\'business\',\'nextStep\',this.value)">'+esc(d.business.nextStep)+'</textarea></div>'
  );

  /* 10. Evening */
  const pl = { mirror:'Mirror gazing', reverseJournal:'Reverse journal', imagine:'Imagine your future state', silence:'20 min silence', patterns:"Notice today's patterns" };
  html += cardShell('evening','var(--taupe)','Evening Ritual',
    affirmHtml('evening')
    + '<div class="field"><label>Pick at least one tonight</label><div class="chip-row">'
    + Object.keys(pl).map(k=>'<div class="chip '+(d.evening.practices[k]?'selected':'')+'" onclick="togglePractice(\''+k+'\')">'+esc(pl[k])+'</div>').join('')
    + '</div></div>'
    + '<div class="field"><label>Anything worth remembering</label><textarea oninput="updateNested(\'evening\',\'practiceNote\',this.value)">'+esc(d.evening.practiceNote)+'</textarea></div>'
    + '<div class="field"><label>Nightly journal</label><textarea oninput="updateNested(\'evening\',\'journal\',this.value)" placeholder="A few sentences is enough — every night.">'+esc(d.evening.journal)+'</textarea></div>'
  );

  html += '<div class="signout-link" onclick="sb.auth.signOut()">Sign out</div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}

/* ---------- Today's Log handlers ---------- */
function updateField(k,v){ state.dayData[k]=v; scheduleSave(); }
function toggleField(k){ state.dayData[k]=!state.dayData[k]; scheduleSave(); renderToday(); }
function updateNested(g,k,v){ state.dayData[g][k]=v; scheduleSave(); }
function updateSpend(k,v){ state.dayData.spend[k] = v===''?0:num(v,0); scheduleSave(); renderToday(); }
function updateCardio(k,v){ state.dayData.cardio[k]=v; scheduleSave(); }
function toggleCardioDone(){ state.dayData.cardio.stairDone = !state.dayData.cardio.stairDone; scheduleSave(); renderToday(); }
function setIntensity(v){ state.dayData.cardio.intensity = (state.dayData.cardio.intensity===v?'':v); scheduleSave(); renderToday(); }
function togglePractice(k){ state.dayData.evening.practices[k] = !state.dayData.evening.practices[k]; scheduleSave(); renderToday(); }
function updateLearning(i,k,v){ state.dayData.learning.entries[i][k]=v; scheduleSave(); }
function setWaterOz(v){ state.dayData.waterOz = v===''?0:num(v,0); scheduleSave(); renderToday(); }
function tapWaterDot(n){
  const cur = Math.floor(num(state.dayData.waterOz,0)/12);
  state.dayData.waterOz = (cur === n) ? (n-1)*12 : n*12;
  scheduleSave(); renderToday();
}
function updateSet(ei,si,k,v){ state.dayData.exercises[ei].sets[si][k]=v; scheduleSave(); }
function removeExercise(i){ state.dayData.exercises.splice(i,1); scheduleSave(); renderToday(); }
function openSwap(i){
  const ex = state.dayData.exercises[i];
  const opts = SWAP_LIBRARY[ex.group] || [];
  if (!opts.length){ alert('No swaps available for this exercise.'); return; }
  const choice = prompt('Swap "'+ex.exerciseName+'" for:\n\n'+opts.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const idx = parseInt(choice,10);
  if (!idx || idx < 1 || idx > opts.length) return;
  if (!ex.swappedFrom) ex.swappedFrom = ex.exerciseName;
  ex.exerciseName = opts[idx-1];
  scheduleSave(); renderToday();
}
function openAddExercise(){
  const groups = Object.keys(SWAP_LIBRARY);
  const g = prompt('Add an exercise — choose a group:\n\n'+groups.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const gi = parseInt(g,10);
  if (!gi || gi < 1 || gi > groups.length) return;
  const group = groups[gi-1];
  const opts = SWAP_LIBRARY[group];
  const c = prompt('Choose an exercise:\n\n'+opts.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const ci = parseInt(c,10);
  if (!ci || ci < 1 || ci > opts.length) return;
  state.dayData.exercises.push({
    exerciseName: opts[ci-1], group: group, targetSets: 3, targetReps: '8-12', repTop: 12,
    note: '', suggested: '', repsOnly: group === 'Core', swappedFrom: null, added: true,
    sets: [ {weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''} ]
  });
  scheduleSave(); renderToday();
}
function updateFrench(k,v){ state.dayData.french[k]=v; scheduleSave(); }
function toggleFrenchChallenge(){ state.dayData.french.challengeDone = !state.dayData.french.challengeDone; scheduleSave(); renderToday(); }
function toggleFrenchMethod(m){
  const arr = state.dayData.french.methods;
  const i = arr.indexOf(m);
  if (i === -1) arr.push(m); else arr.splice(i,1);
  scheduleSave(); renderToday();
}
function updateFrenchWord(i,k,v){ state.dayData.french.newWords[i][k]=v; scheduleSave(); }
async function saveWordOfDay(){
  const w = wordOfDay(isoDate(state.currentDate));
  if (!state.frenchWords.some(x=>x.fr === w.fr)){
    state.frenchWords.push({fr:w.fr, en:w.en, added: isoDate(state.currentDate)});
    await saveFrenchWords();
  }
  state.dayData.french.savedWordOfDay = true;
  scheduleSave(); renderToday();
}
async function collectNewWords(){
  let added = 0;
  state.dayData.french.newWords.forEach(w=>{
    if (w.fr && w.fr.trim() && !state.frenchWords.some(x=>x.fr === w.fr.trim())){
      state.frenchWords.push({fr:w.fr.trim(), en:(w.en||'').trim(), added: isoDate(state.currentDate)});
      added++;
    }
  });
  if (added){ await saveFrenchWords(); }
  alert(added ? (added + ' word' + (added>1?'s':'') + ' added to your collection.') : 'No new words to add.');
}
</script>
<script>
/* =========================================================================
   MEALS TAB
   ========================================================================= */
async function renderMeals(){
  const d = await ensureDay();
  const dt = state.currentDate, dateStr = isoDate(dt);
  const main = document.getElementById('main-content');
  const tg = targetsFor(dateStr);

  let html = '<h2 style="font-size:17px;margin-bottom:10px;">Meals</h2>' + affirmHtml('meals');
  if (isMonday(dt)){
    html += '<div class="info-note">Weekly fast ends at 4:00 PM. Two meals today, in the 4:00–6:30 PM window.</div>';
  }
  const salmon = salmonToday(d);

  d.meals.forEach((m, mi)=>{
    html += '<div class="meal-block"><h4><span>'+esc(m.name)+'</span><span class="time">'+esc(m.time)+'</span></h4>';
    if (salmon && m.name === 'Meal 2'){
      html += '<div class="info-note">Salmon day — consider skipping the avocado to keep calories level.</div>';
    }
    m.items.forEach((it, ii)=>{
      html += '<div class="food-item">'
        + '<input type="checkbox" '+(it.checked?'checked':'')+' onchange="toggleMealItem('+mi+','+ii+')">'
        + '<div class="fi-body"><div class="fi-name">'+esc(it.name)+'</div>'
        + '<div class="fi-macro">'+it.cal+' cal · '+it.protein+'g P · '+it.carb+'g C · '+it.fat+'g F</div>'
        + (it.isFish ? '<select class="fish-select" onchange="setFish('+mi+','+ii+',this.value)">'
            + Object.keys(FISH_OPTIONS).map(f=>'<option value="'+f+'" '+(it.fishType===f?'selected':'')+'>'+f+'</option>').join('')
            + '</select>' : '')
        + '</div></div>';
    });
    m.extras.forEach((ex, ei)=>{
      if (ex){
        html += '<div class="extra-row"><div class="extra-selected">'
          + '<div class="fi-body"><div class="fi-name">'+esc(ex.name)+'</div>'
          + '<div class="fi-macro">'+ex.cal+' cal · '+ex.protein+'g P · '+ex.carb+'g C · '+ex.fat+'g F</div></div>'
          + '<div class="rm" onclick="clearExtra('+mi+','+ei+')">remove</div></div></div>';
      } else {
        html += '<div class="extra-row">'
          + '<input class="extra-search" placeholder="Add extra item…" oninput="searchFood('+mi+','+ei+',this.value)">'
          + '<div class="search-results" id="results-'+mi+'-'+ei+'" hidden></div></div>';
      }
    });
    html += '</div>';
  });

  const tot = mealTotals(d);
  const pct = (v,t)=>Math.min(100, Math.round((v/t)*100));
  html += '<div class="totals-card"><h3 style="font-size:14px;margin-bottom:8px;">Daily Totals</h3>'
    + '<div class="trow"><span>Calories</span><b>'+tot.cal+' / '+tg.cal+'</b></div><div class="bar-bg"><div class="bar-fill" style="width:'+pct(tot.cal,tg.cal)+'%"></div></div>'
    + '<div class="trow"><span>Protein</span><b>'+tot.protein+'g / '+tg.protein+'g</b></div><div class="bar-bg"><div class="bar-fill" style="width:'+pct(tot.protein,tg.protein)+'%"></div></div>'
    + '<div class="trow"><span>Carbs</span><b>'+tot.carb+'g / '+tg.carb+'g</b></div><div class="bar-bg"><div class="bar-fill" style="width:'+pct(tot.carb,tg.carb)+'%"></div></div>'
    + '<div class="trow"><span>Fat</span><b>'+tot.fat+'g / '+tg.fat+'g</b></div><div class="bar-bg"><div class="bar-fill" style="width:'+pct(tot.fat,tg.fat)+'%"></div></div>'
    + '</div>';
  html += '<div class="field" style="margin-top:14px;"><label>Notes</label><textarea oninput="updateField(\'mealNotes\', this.value)" placeholder="e.g. added ½ cup Greek yogurt">'+esc(d.mealNotes)+'</textarea></div>';
  html += '<div class="link-row"><a href="#" onclick="selectTab(\'today\');return false;">← Back to Today\'s Log</a><a href="#" onclick="selectTab(\'dashboard\');return false;">View 90-Day Dashboard →</a></div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}
function toggleMealItem(mi,ii){
  const it = state.dayData.meals[mi].items[ii];
  it.checked = !it.checked;
  scheduleSave(); renderMeals();
}
function setFish(mi,ii,val){
  const it = state.dayData.meals[mi].items[ii];
  it.fishType = val;
  applyFish(it);
  scheduleSave(); renderMeals();
}
function clearExtra(mi,ei){ state.dayData.meals[mi].extras[ei] = null; scheduleSave(); renderMeals(); }
function searchFood(mi,ei,q){
  const box = document.getElementById('results-'+mi+'-'+ei);
  if (!box) return;
  if (!q || !q.trim()){ box.hidden = true; box.innerHTML=''; return; }
  const ql = q.trim().toLowerCase();
  const matches = [];
  FOOD_DB.forEach((f, idx)=>{ if (matches.length < 12 && f.name.toLowerCase().indexOf(ql) !== -1) matches.push({f:f, idx:idx}); });
  if (!matches.length){ box.hidden = true; return; }
  box.innerHTML = matches.map(m=>'<div onclick="selectFood('+mi+','+ei+','+m.idx+')">'+esc(m.f.name)+' <span style="color:var(--ink-soft);">('+esc(m.f.serving)+' · '+m.f.cal+' cal)</span></div>').join('');
  box.hidden = false;
}
function selectFood(mi,ei,idx){
  const f = FOOD_DB[idx];
  state.dayData.meals[mi].extras[ei] = { name: f.name+' ('+f.serving+')', cal:f.cal, protein:f.protein, carb:f.carb, fat:f.fat };
  scheduleSave(); renderMeals();
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
async function renderDashboard(){
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="padding:30px 0;text-align:center;color:var(--ink-soft);">Loading dashboard…</div>';
  const allDays = await getAllDays();
  const startStr = state.programStart;
  const startDate = parseIso(startStr);
  const today = new Date();
  const daysElapsed = Math.max(1, Math.min(90, Math.floor((today - startDate)/86400000) + 1));
  const week = Math.max(1, Math.min(13, Math.ceil(daysElapsed/7)));

  let trainingSessions=0, stairSessions=0, cardioMinutes=0, stepsSum=0, stepsDays=0;
  let totalSpend=0, businessWins=0, eveningJournals=0, bestPush=0, bestPull=0;
  let calSum=0,pSum=0,cSum=0,fSum=0,mealDays=0, waterSum=0, waterDays=0;
  const learnCounts = {Book:0,Audiobook:0,Podcast:0,Article:0,Course:0,Unspecified:0};
  let learningSessions=0;
  let frTotalMin=0, frWords=state.frenchWords.length;
  const weightPoints = [], dayMap = {}, liftLog = {};

  allDays.forEach(row=>{
    const dd = mergeDay(defaultDay(row.date), row.data);
    dayMap[row.date] = dd;
    if (dd.trained) trainingSessions++;
    if (dd.cardio.stairDone) stairSessions++;
    cardioMinutes += num(dd.cardio.stairMinutes,0) + num(dd.cardio.walkMinutes,0);
    if (num(dd.cardio.steps,0) > 0){ stepsSum += num(dd.cardio.steps,0); stepsDays++; }
    totalSpend += Object.keys(dd.spend).reduce((a,k)=>a+num(dd.spend[k],0),0);
    if (dd.business.win && dd.business.win.trim()) businessWins++;
    if (dd.evening.journal && dd.evening.journal.trim()) eveningJournals++;
    dd.learning.entries.forEach(e=>{
      if ((e.title && e.title.trim()) || (e.insight && e.insight.trim())){
        learningSessions++;
        if (e.type && learnCounts[e.type] !== undefined) learnCounts[e.type]++; else learnCounts.Unspecified++;
      }
    });
    frTotalMin += num(dd.french.minutes,0);
    const t = mealTotals(dd);
    if (t.cal > 0){ calSum+=t.cal; pSum+=t.protein; cSum+=t.carb; fSum+=t.fat; mealDays++; }
    if (num(dd.waterOz,0) > 0){ waterSum += num(dd.waterOz,0); waterDays++; }
    if (dow(row.date) === 1 && dd.weight) weightPoints.push({date:row.date, weight:dd.weight});
    dd.exercises.forEach(ex=>{
      const reps = ex.sets.map(s=>num(s.reps,0));
      if (ex.exerciseName === 'Push-ups') bestPush = Math.max(bestPush, ...reps, 0);
      if (ex.exerciseName.indexOf('Pull-ups') === 0) bestPull = Math.max(bestPull, ...reps, 0);
      if (MAIN_LIFTS.indexOf(ex.exerciseName) !== -1){
        const weights = ex.sets.map(s=>num(s.weight,0)).filter(w=>w>0);
        if (weights.length){
          if (!liftLog[ex.exerciseName]) liftLog[ex.exerciseName] = { first:null, best:0, firstDate:row.date };
          const rec = liftLog[ex.exerciseName];
          if (rec.first === null) rec.first = Math.max.apply(null, weights);
          rec.best = Math.max(rec.best, Math.max.apply(null, weights));
        }
      }
    });
  });
  weightPoints.sort((a,b)=>a.date.localeCompare(b.date));
  const avg = (s,c)=> c>0 ? Math.round(s/c) : 0;
  const lvl = frenchLevel(frTotalMin);
  const streak = frenchStreak(allDays, isoDate(today));
  let longestStreak = 0, run = 0;
  const sortedDates = allDays.map(r=>r.date).sort();
  let prev = null;
  sortedDates.forEach(ds=>{
    const row = allDays.find(r=>r.date===ds);
    const has = row.data && row.data.french && num(row.data.french.minutes,0) > 0;
    if (has){
      if (prev && (parseIso(ds) - parseIso(prev)) === 86400000) run++; else run = 1;
      longestStreak = Math.max(longestStreak, run);
      prev = ds;
    } else { run = 0; prev = null; }
  });

  let html = '<h2 style="font-size:17px;margin-bottom:10px;">90-Day Dashboard</h2>';
  html += '<div class="field"><label>Program start date</label><input type="date" value="'+startStr+'" onchange="changeProgramStart(this.value)"></div>';
  html += '<div class="field"><label>French weekly goal (min)</label>'+numInput(state.frenchWeeklyGoal, "changeFrenchGoal(this.value)", '90', true)+'</div>';
  html += '<div style="font-size:13px;color:var(--ink-soft);">Day '+daysElapsed+' of 90 · Week '+week+' · '+phaseName(week)+' · '+allDays.length+' days logged</div>';
  html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+Math.min(100,(daysElapsed/90)*100)+'%"></div></div>';

  html += '<div class="stat-grid">'
    + tile(trainingSessions,'Training sessions')
    + tile(stairSessions,'Stair climber sessions')
    + tile(Math.round(cardioMinutes),'Total cardio minutes')
    + tile(avg(stepsSum,stepsDays).toLocaleString(),'Avg daily steps')
    + tile(avg(pSum,mealDays)+'g','Avg protein/day')
    + tile(avg(calSum,mealDays),'Avg calories/day')
    + tile(avg(cSum,mealDays)+'g','Avg carbs/day')
    + tile(avg(fSum,mealDays)+'g','Avg fat/day')
    + tile(avg(waterSum,waterDays)+'oz','Avg water/day')
    + tile('$'+Math.round(totalSpend),'Total spend')
    + tile(businessWins,'Business wins')
    + tile(learningSessions,'Learning sessions')
    + tile(eveningJournals,'Evening journals')
    + tile(bestPush,'Best push-up set')
    + tile(bestPull,'Best pull-up set')
    + '</div>';

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Learning by type</h3><div class="card"><div class="card-body" style="padding-top:12px;">'
    + Object.keys(learnCounts).map(k=>'<div class="lift-row"><span class="lname">'+k+'</span><span class="lval">'+learnCounts[k]+'</span></div>').join('')
    + '</div></div>';

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Strength progress</h3><div class="card"><div class="card-body" style="padding-top:12px;">';
  const liftNames = Object.keys(liftLog);
  if (!liftNames.length) html += '<div class="msg">No main lifts logged yet.</div>';
  else liftNames.forEach(n=>{
    const r = liftLog[n];
    const change = r.best - r.first;
    html += '<div class="lift-row"><span class="lname">'+esc(n)+'</span><span class="lval">'+r.first+' → '+r.best+' lb ('+(change>=0?'+':'')+change+')</span></div>';
  });
  html += '</div></div>';

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">French progress 🇫🇷</h3><div class="card french-card"><div class="card-body" style="padding-top:12px;">'
    + '<div class="lift-row"><span class="lname">Current streak</span><span class="lval">🔥 '+streak+' days</span></div>'
    + '<div class="lift-row"><span class="lname">Longest streak</span><span class="lval">'+longestStreak+' days</span></div>'
    + '<div class="lift-row"><span class="lname">Total minutes</span><span class="lval">'+Math.round(frTotalMin)+'</span></div>'
    + '<div class="lift-row"><span class="lname">Level</span><span class="lval">'+esc(lvl.current.name)+(lvl.next?(' · '+Math.max(0,lvl.next.min-Math.round(frTotalMin))+' min to '+lvl.next.name):' · max')+'</span></div>'
    + '<div class="lift-row" style="cursor:pointer;" onclick="state.showWordList=!state.showWordList;renderDashboard()"><span class="lname">Word collection</span><span class="lval">'+frWords+' words ▸</span></div>'
    + (state.showWordList ? '<div class="word-list" style="margin-top:8px;">'+(state.frenchWords.length? state.frenchWords.map(w=>'<div><b>'+esc(w.fr)+'</b> — '+esc(w.en)+'</div>').join('') : '<div class="msg">No words saved yet.</div>')+'</div>' : '')
    + '</div></div>';

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Weight trend (Mondays)</h3>';
  if (weightPoints.length < 2) html += '<div class="rest-msg">Not enough Monday weigh-ins yet to chart a trend.</div>';
  else {
    const W=340,H=120,pad=20;
    const ws = weightPoints.map(p=>p.weight);
    const minW = Math.min.apply(null,ws), maxW = Math.max.apply(null,ws), range = (maxW-minW)||1;
    const stepX = (W-2*pad)/(weightPoints.length-1);
    const pts = weightPoints.map((p,i)=>(pad+i*stepX)+','+(H-pad-((p.weight-minW)/range)*(H-2*pad)));
    html += '<div class="card"><div class="card-body" style="padding-top:14px;">'
      + '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'"><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--rose)" stroke-width="2.5"/>'
      + pts.map(p=>{const q=p.split(','); return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="var(--rose)"/>';}).join('')
      + '</svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;">'
      + '<span>'+weightPoints[0].weight+' lbs</span><span>'+weightPoints[weightPoints.length-1].weight+' lbs</span></div></div></div>';
  }

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">90-day training heatmap</h3>';
  let cells = '';
  for (let i=0;i<91;i++){
    const cd = new Date(startDate); cd.setDate(cd.getDate()+i);
    const cds = isoDate(cd);
    let color = '#EDE9DC';
    if (cd <= today){
      if (isRestDay(cd)) color = 'var(--gold)';
      else if (dayMap[cds] && dayMap[cds].trained) color = 'var(--moss)';
      else color = 'var(--rose)';
    }
    cells += '<div class="heat-cell" style="background:'+color+'" title="'+cds+'"></div>';
  }
  html += '<div class="heatmap-grid">'+cells+'</div>'
    + '<div class="legend"><span><i style="background:var(--moss)"></i>Trained</span><span><i style="background:var(--gold)"></i>Rest day</span>'
    + '<span><i style="background:var(--rose)"></i>Missed</span><span><i style="background:#EDE9DC"></i>Upcoming</span></div>';

  html += '<div class="signout-link" onclick="sb.auth.signOut()">Sign out</div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}
function tile(v,l){ return '<div class="stat-tile"><div class="num">'+v+'</div><div class="lbl">'+l+'</div></div>'; }
async function changeProgramStart(v){
  state.programStart = v;
  await setSetting('programStart', {date:v});
  await renderDashboard();
}
async function changeFrenchGoal(v){
  state.frenchWeeklyGoal = num(v,90) || 90;
  await setSetting('frenchWeeklyGoal', {minutes: state.frenchWeeklyGoal});
}
</script>
