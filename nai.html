    --gold:#C08A3E;
    --rose:#B4685F;
    --teal:#4A7F76;

    --ink:#26281F;
    --ink-soft:#63665A;
    --border:#E0DED0;
    --danger:#A8443C;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3,h4{font-family:'Archivo Expanded',sans-serif;letter-spacing:.01em;color:var(--ink);margin:0;}
  input,textarea,select,button{font-family:inherit;font-size:16px;}
  a{color:var(--sage-dark);}

  #app-shell{max-width:520px;margin:0 auto;padding-bottom:90px;min-height:100vh;}
  header.top{position:sticky;top:0;z-index:20;background:var(--cream);padding:14px 16px 8px;border-bottom:1px solid var(--border);}
  header.top h1{font-size:19px;}
  .tabs{display:flex;gap:6px;margin-top:12px;}
  .tab-btn{flex:1;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 5px;font-size:12px;line-height:1.2;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;}
  .navbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:17px;cursor:pointer;color:var(--ink);}
  .date-label{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .today-btn{background:var(--card);border:1px solid var(--sage);color:var(--sage-dark);border-radius:10px;padding:0 12px;height:40px;font-size:13px;font-weight:600;cursor:pointer;}
  main{padding:14px 16px 40px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;}
  .card-header .title-wrap{display:flex;align-items:center;gap:8px;}
  .card-header .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .card-header h3{font-size:15.5px;}
  .card-header .chev{color:var(--ink-soft);transition:transform .15s;font-size:13px;}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card-body{padding:0 16px 16px;}
  .card.collapsed .card-body{display:none;}

  .affirm{font-size:12.5px;font-style:italic;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
  .affirm div{margin-bottom:3px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:#FDFDF9;color:var(--ink);font-size:16px;}
  .field textarea{min-height:66px;resize:vertical;line-height:1.45;}
  .field .msg{font-size:14px;color:var(--ink-soft);font-style:italic;padding:8px 0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .label{font-size:14px;}
  .toggle-row .sub{font-size:11.5px;color:var(--ink-soft);}
  .switch{width:46px;height:27px;border-radius:999px;background:#E2E0D2;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;border:none;}
  .switch.on{background:var(--sage);}
  .switch .knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on .knob{left:22px;}

  .rest-msg{background:#F7F3E8;border:1px dashed var(--gold);border-radius:10px;padding:16px;text-align:center;color:#84632A;font-size:14px;font-weight:600;}
  .info-note{background:#F7F3E8;border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font-size:13px;color:#84632A;margin:10px 0;line-height:1.45;}
  .deload-note{background:#EFF4EE;border:1px solid var(--sage);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--sage-dark);margin:10px 0;line-height:1.45;}

  .dots-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;}
  .water-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--teal);background:transparent;cursor:pointer;flex-shrink:0;}
  .water-dot.filled{background:var(--teal);}
  .water-sub{font-size:12px;color:var(--ink-soft);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:#FDFDF9;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  .chip.selected{background:var(--taupe);color:#fff;border-color:var(--taupe);}
  .chip.gut.selected{background:var(--rose);border-color:var(--rose);}
  .chip.uni.selected{background:var(--gold);border-color:var(--gold);}
  .chip.cardio.selected{background:var(--teal);border-color:var(--teal);}

  .ex-card{border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:11px;background:#FDFDF9;}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ex-name{font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;}
  .ex-target{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .ex-note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.4;overflow-wrap:anywhere;}
  .ex-last{font-size:12px;color:var(--sage-dark);margin-top:6px;font-family:'IBM Plex Mono',monospace;overflow-wrap:anywhere;}
  .ex-nudge{font-size:12.5px;color:#84632A;background:#F7F3E8;border-radius:7px;padding:6px 9px;margin-top:6px;}
  .ex-actions{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{background:#fff;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .mini-btn.danger{color:var(--danger);}
  .set-row{display:flex;align-items:center;gap:8px;margin-top:7px;}
  .set-row .set-lbl{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;width:40px;flex-shrink:0;}
  .set-row input{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:16px;}
  .add-ex-btn{width:100%;padding:11px;border:1px dashed var(--sage);background:transparent;color:var(--sage-dark);border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}

  .warmup{background:#F3F5F0;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:12px;}
  .warmup h4{font-size:13px;margin-bottom:6px;color:var(--sage-dark);}
  .warmup ol{margin:0;padding-left:18px;}
  .warmup li{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:3px;overflow-wrap:anywhere;}

  .notes-block{margin-bottom:16px;}
  .notes-block h4{font-size:14px;margin-bottom:5px;color:var(--sage-dark);}
  .notes-block p{font-size:13.5px;line-height:1.55;color:var(--ink);margin:0 0 7px;overflow-wrap:anywhere;}

  .food-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .food-row:last-child{border-bottom:none;}
  .fi-body{flex:1;min-width:0;}
  .fi-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere;}
  .fi-macro{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;overflow-wrap:anywhere;}
  .rm{color:var(--danger);cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .extra-search{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:#FDFDF9;font-size:16px;}
  .search-results{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:230px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.1);}
  .search-results div{padding:10px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
  .search-results div:last-child{border-bottom:none;}

  .totals-card{background:#F8F8F1;border:1px solid var(--border);border-radius:12px;padding:14px;}

  .totals-card .trow b{font-family:'IBM Plex Mono',monospace;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .stat-tile .num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat-tile .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
  .progress-bar-bg{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0;}
  .progress-bar-fill{height:100%;background:var(--sage);}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .heat-cell{aspect-ratio:1;border-radius:3px;}

  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .lift-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .lift-row:last-child{border-bottom:none;}
  .lift-row .lname{flex:1;min-width:0;overflow-wrap:anywhere;}
  .lift-row .lval{font-family:'IBM Plex Mono',monospace;flex-shrink:0;color:var(--ink-soft);}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 26px;max-width:360px;width:100%;}
  .login-card h1{font-size:20px;margin-bottom:6px;}
  .login-card p{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .login-card button.submit{width:100%;padding:13px;border:none;border-radius:10px;background:var(--sage);color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}

  .save-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;padding:11px 16px;box-shadow:0 -4px 14px rgba(0,0,0,.15);}
  .save-bar .status{font-size:13px;}
  .save-bar .status.err{color:#FFB4AE;}
  .save-bar button{background:var(--sage);color:#fff;border:none;border-radius:9px;padding:9px 20px;font-weight:600;font-size:14px;cursor:pointer;}
  .signout-link{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline;}
  .build-tag{text-align:center;font-size:10px;color:var(--ink-soft);margin-top:10px;font-family:'IBM Plex Mono',monospace;}
  .link-row{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13.5px;}
  [hidden]{display:none!important;}
</style>
</head>

    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button class="submit" type="submit">Sign In</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<div id="app-shell" hidden>

      <button class="tab-btn" data-tab="meals">Food</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </div>
    <div class="date-nav" id="date-nav">

      <div class="date-label" id="date-label"></div>
      <button class="navbtn" id="next-day">&rsaquo;</button>
      <button class="today-btn" id="today-btn">Today</button>
    </div>
  </header>
  <main id="main-content"></main>
</div>

<div class="save-bar" id="save-bar" hidden>
  <span class="status" id="save-status">Unsaved changes</span>
  <button id="save-btn" onclick="saveNow()">Save</button>
</div>

function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
function parseIso(s){ const p=String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function dow(x){ return (typeof x === 'string' ? parseIso(x) : x).getDay(); }
function num(v, fb){ const n = Number(v); return isFinite(n) ? n : fb; }
function round1(n){ return Math.round(n*10)/10; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDateLabel(d){
  let lbl = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  if (isoDate(d) === isoDate(new Date())) lbl += ' (Today)';
  return lbl;
}
function sessionByKey(k){ return SESSIONS[k] || null; }
function sessionForDate(d){ return SESSIONS[WEEKDAY_SESSION[dow(d)]]; }
function allSessions(){ return ['push','pull','lower','arms','mobility','rest'].map(k=>SESSIONS[k]); }
function effectiveSession(d, dt){ return (d && d.sessionKey && sessionByKey(d.sessionKey)) || sessionForDate(dt); }

function programDayNumber(dateStr){
  if (!state.programStart) return 1;
  return Math.floor((parseIso(dateStr) - parseIso(state.programStart))/86400000) + 1;
}
function programWeek(dateStr){ return Math.max(1, Math.ceil(programDayNumber(dateStr)/7)); }
function cycleWeek(week){ return ((week-1) % 5) + 1; }
function isDeload(week){ return cycleWeek(week) === 5; }
function setsForWeek(ex, cw){ return cw === 5 ? 1 : ex.sets; }
function rpeForWeek(ex, cw){ return ex.rpe ? ex.rpe[cw-1] : null; }

function hashStr(s){ let h=1779033703 ^ s.length; for (let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return (h ^ h>>>16)>>>0; }
function mulberry32(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seededShuffle(arr, seed){ const a=arr.slice(), rand=mulberry32(seed); for (let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function dayIndexFor(dateStr){ return Math.round((parseIso(dateStr) - new Date(2020,0,1))/86400000); }
function pickFromPool(pool, count, category, dateStr){
  const len = pool.length; let offset = dayIndexFor(dateStr)*count; const out = [];
  while (out.length < count){
    const cycle = Math.floor(offset/len), idx = ((offset % len)+len)%len;
    out.push(seededShuffle(pool, hashStr(category+':'+cycle))[idx]); offset++;
  }
  return out;
}
function affirmHtml(category){
  return '<div class="affirm">' + pickFromPool(AFFIRMATIONS[category], AFFIRM_COUNTS[category], category, isoDate(state.currentDate)).map(a=>'<div>"'+esc(a)+'"</div>').join('') + '</div>';
}

  if (!s || !s.exercises.length) return [];
  const cw = cycleWeek(week || 1);
  return s.exercises.map(ex => {
    const n = setsForWeek(ex, cw);
    return {
      exerciseName: ex.name, group: ex.group,
      targetSets: n, targetReps: ex.reps, repTop: ex.repTop || null,
      rpe: rpeForWeek(ex, cw) || '', repsOnly: !!ex.repsOnly,
      swappedFrom: null, added: false,

  });
}

    legacy.oldExercises = saved.exercises;
  }
  if (saved.legacy) Object.assign(legacy, saved.legacy);
  if (Object.keys(legacy).length) out.legacy = legacy;
  return out;
}

/* =========================================================================
   SUPABASE
   ========================================================================= */
async function loadDay(dateStr){
  const base = defaultDay(dateStr);
  const res = await sb.from('days').select('data').eq('user_id', state.userId).eq('date', dateStr).maybeSingle();
  if (res.error){ console.error(res.error); return base; }
  return res.data && res.data.data ? mergeDay(base, res.data.data) : base;
}
function scheduleSave(){ state.dirty = true; setSaveState('unsaved'); clearTimeout(state.saveTimer); state.saveTimer = setTimeout(saveCurrentDay, 800); }
async function saveCurrentDay(){
  if (!state.dayData || !state.userId) return false;
  clearTimeout(state.saveTimer); setSaveState('saving');
  const res = await sb.from('days').upsert({
    user_id: state.userId, date: isoDate(state.currentDate), data: state.dayData, updated_at: new Date().toISOString()
  }, { onConflict: 'user_id,date' });
  if (res.error){ console.error(res.error); setSaveState('error'); return false; }
  state.dirty = false; state.allDaysCache = null; state.recentDaysCache = null;
  setSaveState('saved'); return true;
}
async function saveNow(){ await saveCurrentDay(); }
async function flushPendingSave(){ if (state.dirty) await saveCurrentDay(); }
let savedHideTimer;
function setSaveState(s){
  state.saveState = s;
  const bar = document.getElementById('save-bar'), st = document.getElementById('save-status'), btn = document.getElementById('save-btn');
  if (!bar) return;
  clearTimeout(savedHideTimer); st.classList.remove('err');
  if (s === 'idle'){ bar.hidden = true; return; }
  bar.hidden = false;
  if (s === 'unsaved'){ st.textContent = 'Unsaved changes'; btn.textContent = 'Save'; btn.hidden = false; }
  else if (s === 'saving'){ st.textContent = 'Saving…'; btn.hidden = true; }
  else if (s === 'saved'){ st.textContent = 'Saved'; btn.hidden = true; savedHideTimer = setTimeout(()=>{ if (state.saveState==='saved'){ bar.hidden = true; state.saveState='idle'; } }, 1500); }
  else if (s === 'error'){ st.textContent = "Couldn't save"; st.classList.add('err'); btn.textContent = 'Retry'; btn.hidden = false; }
}
async function getSetting(key, fb){
  const res = await sb.from('app_settings').select('value').eq('user_id', state.userId).eq('key', key).maybeSingle();
  if (res.error || !res.data) return fb;
  return res.data.value === undefined ? fb : res.data.value;
}
async function setSetting(key, value){ await sb.from('app_settings').upsert({ user_id: state.userId, key: key, value: value }, { onConflict:'user_id,key' }); }
async function loadSettings(){
  const ps = await getSetting('programStart', null);
  if (ps && ps.date) state.programStart = ps.date;
  else { state.programStart = isoDate(new Date()); await setSetting('programStart', {date: state.programStart}); }
}
async function getAllDays(){
  if (state.allDaysCache) return state.allDaysCache;
  const res = await sb.from('days').select('date,data').eq('user_id', state.userId).order('date');
  if (res.error){ console.error(res.error); return []; }
  state.allDaysCache = (res.data||[]).filter(r=>!state.programStart || r.date >= state.programStart);
  return state.allDaysCache;
}
async function getRecentDays(){
  if (state.recentDaysCache) return state.recentDaysCache;
  const res = await sb.from('days').select('date,data').eq('user_id', state.userId).order('date', {ascending:false}).limit(30);
  if (res.error){ console.error(res.error); return []; }
  state.recentDaysCache = (res.data||[]).filter(r=>!state.programStart || r.date >= state.programStart);
  return state.recentDaysCache;
}
function navLowerBound(){
  const t = isoDate(new Date());
  if (!state.programStart) return t;
  return state.programStart < t ? state.programStart : t;
}

/* =========================================================================
   AUTH
   ========================================================================= */
document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err'); errEl.textContent = '';
  const res = await sb.auth.signInWithPassword({ email, password });
  if (res.error) errEl.textContent = res.error.message;
});
async function onLogin(user){
  state.userId = user.id;
  document.getElementById('login-screen').hidden = true;
  document.getElementById('app-shell').hidden = false;
  await loadSettings(); await getRecentDays(); await selectTab('today');
}
function onLogout(){
  state.userId = null; state.allDaysCache = null; state.recentDaysCache = null; state.dayData = null;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('app-shell').hidden = true;
  setSaveState('idle');
}
async function initAuth(){
  const res = await sb.auth.getSession();
  if (res.data && res.data.session) onLogin(res.data.session.user);
  sb.auth.onAuthStateChange((event, session)=>{
    if (event === 'SIGNED_IN' && session) onLogin(session.user);
    if (event === 'SIGNED_OUT') onLogout();
  });
}
initAuth();
window.addEventListener('beforeunload', (e)=>{ if (state.dirty){ e.preventDefault(); e.returnValue = ''; } });

/* =========================================================================
   NAVIGATION
   ========================================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click', ()=>selectTab(btn.dataset.tab)));
document.getElementById('prev-day').addEventListener('click', ()=>changeDate(-1));
document.getElementById('next-day').addEventListener('click', ()=>changeDate(1));
document.getElementById('today-btn').addEventListener('click', async ()=>{
  await flushPendingSave(); state.currentDate = new Date(); state.dayData = null; await refreshTab();
});
async function changeDate(delta){
  const d = new Date(state.currentDate); d.setDate(d.getDate()+delta);
  if (delta < 0 && isoDate(d) < navLowerBound()) return;
  await flushPendingSave();
  state.currentDate = d; state.dayData = null; await refreshTab();
}
async function refreshTab(){
  updateDateNav();
  if (state.currentTab === 'today') await renderToday();
  else if (state.currentTab === 'meals') await renderFood();
  else if (state.currentTab === 'notes') renderNotes();
  else await renderDashboard();
}
function updateDateNav(){
  document.getElementById('date-label').textContent = fmtDateLabel(state.currentDate);
  const hide = state.currentTab === 'dashboard' || state.currentTab === 'notes';
  document.getElementById('date-nav').style.display = hide ? 'none' : 'flex';
  const prev = document.getElementById('prev-day');
  if (prev){
    const atBound = isoDate(state.currentDate) <= navLowerBound();
    prev.disabled = atBound; prev.style.opacity = atBound ? '0.3' : '1';
  }
}
async function selectTab(tab){
  await flushPendingSave();
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  await refreshTab();
}
async function ensureDay(){
  const dateStr = isoDate(state.currentDate);
  if (!state.dayData || state.dayData.date !== dateStr) state.dayData = await loadDay(dateStr);
  return state.dayData;
}
function cardShell(id, dotColor, title, bodyHtml){
  const open = state.openCards.has(id);
  return '<div class="card '+(open?'':'collapsed')+'" id="card-'+id+'">'
    + '<div class="card-header" onclick="toggleCard(\''+id+'\')">'
    + '<div class="title-wrap"><span class="dot" style="background:'+dotColor+'"></span><h3>'+title+'</h3></div>'
    + '<span class="chev">&#9662;</span></div><div class="card-body">'+bodyHtml+'</div></div>';
}
function toggleCard(id){
  if (state.openCards.has(id)) state.openCards.delete(id); else state.openCards.add(id);
  const el = document.getElementById('card-'+id); if (el) el.classList.toggle('collapsed');
}
function switchHtml(id, on, fn){ return '<button class="switch '+(on?'on':'')+'" id="'+id+'" onclick="'+fn+'"><span class="knob"></span></button>'; }
/* A stored 0 shows as an empty box, so typing a number doesn't append to a leading "0". */
function blankZero(v){ return num(v,0) === 0 ? '' : v; }
function numInput(value, handler, placeholder, whole){
  return '<input type="text" inputmode="'+(whole?'numeric':'decimal')+'" value="'+esc(value==null?'':value)+'" placeholder="'+esc(placeholder||'')+'" oninput="'+handler+'">';
}

/* =========================================================================
   LAST TIME + PROGRESSION
   ========================================================================= */
function lastTimeFor(name, currentDateStr){
  const rows = state.recentDaysCache || [];
  for (const row of rows){
    if (row.date >= currentDateStr) continue;
    const dd = row.data;
    if (!dd || !Array.isArray(dd.exercises)) continue;
    const ex = dd.exercises.find(e=>e && e.exerciseName === name);
    if (!ex || !Array.isArray(ex.sets)) continue;
    const logged = ex.sets.filter(s=>s && String(s.reps).trim() !== '');
    if (!logged.length) continue;
    return { date: row.date, sets: logged, repsOnly: !!ex.repsOnly };
  }
  return null;
}
function lastTimeText(lt){
  if (!lt) return '';
  const reps = lt.sets.map(s=>s.reps).join(', ');
  const w = lt.sets[0] && String(lt.sets[0].weight).trim();
  return (lt.repsOnly || !w) ? ('Last time: ' + reps + ' reps') : ('Last time: ' + w + ' × ' + reps);
}
function progressionNudge(ex, lt){
  if (!lt || ex.repsOnly || !ex.repTop) return '';
  const first2 = lt.sets.slice(0,2);
  if (first2.length < 2) return '';
  const bothTop = first2.every(s=>num(s.reps,0) >= ex.repTop);
  if (!bothTop) return '';
  return '<div class="ex-nudge">First two sets hit the top of the range last time — add 5–10% weight.</div>';
}
function foodTotals(d){
  let cal=0,protein=0,carb=0,fat=0;
  (d.foods||[]).forEach(f=>{ cal+=num(f.cal,0); protein+=num(f.protein,0); carb+=num(f.carb,0); fat+=num(f.fat,0); });
  return { cal:Math.round(cal), protein:round1(protein), carb:round1(carb), fat:round1(fat) };
}
</script>

  html += cardShell('spending','var(--gold)','Spending',

function togglePractice(k){ state.dayData.evening.practices[k] = !state.dayData.evening.practices[k]; scheduleSave(); renderToday(); }
function toggleInArray(arr, v){ const i = arr.indexOf(v); if (i===-1) arr.push(v); else arr.splice(i,1); }
function toggleGut(s){
  const arr = state.dayData.stomach.symptoms;
  if (s === 'No issues'){ state.dayData.stomach.symptoms = (arr.indexOf(s)!==-1) ? [] : ['No issues']; }
  else { const i = arr.indexOf('No issues'); if (i!==-1) arr.splice(i,1); toggleInArray(arr, s); }
  scheduleSave(); renderToday();
}
function toggleUni(a){ toggleInArray(state.dayData.uni.activities, a); scheduleSave(); renderToday(); }
/* Same reasoning as updateSpend: sync the dots and label in place, never re-render. */
function syncWaterUI(){
  const oz = num(state.dayData.waterOz,0);
  const filled = Math.min(9, Math.floor(oz/12));
  document.querySelectorAll('.water-dot').forEach((el,i)=>el.classList.toggle('filled', i < filled));
  const lbl = document.getElementById('water-label');
  if (lbl) lbl.textContent = 'Water — ' + Math.round(oz) + ' oz';
}
function setWaterOz(v){
  state.dayData.waterOz = v===''?0:num(v,0);
  syncWaterUI(); scheduleSave();
}
function tapWaterDot(n){
  const cur = Math.floor(num(state.dayData.waterOz,0)/12);
  state.dayData.waterOz = (cur === n) ? (n-1)*12 : n*12;
  syncWaterUI();
  const inp = document.getElementById('water-oz-input');
  if (inp) inp.value = state.dayData.waterOz;
  scheduleSave();
}
function updateSet(ei,si,k,v){ state.dayData.exercises[ei].sets[si][k]=v; scheduleSave(); }
function removeExercise(i){ state.dayData.exercises.splice(i,1); scheduleSave(); renderToday(); }
function changeSession(key){
  const d = state.dayData, s = sessionByKey(key);
  if (!s || key === d.sessionKey) return;
  const logged = (d.exercises||[]).some(e=>(e.sets||[]).some(st=>String(st.weight||'').trim() || String(st.reps||'').trim()));
  if (logged && !confirm('Switching the session replaces today’s exercises and clears the sets you have logged. Continue?')){ renderToday(); return; }
  d.sessionKey = key;
  d.exercises = exercisesFromSession(s, programWeek(isoDate(state.currentDate)));
  scheduleSave(); renderToday();
}
function openSwap(i){
  const ex = state.dayData.exercises[i];
  const opts = SWAP_LIBRARY[ex.group] || [];
  if (!opts.length){ alert('No swaps listed for this one.'); return; }
  const c = prompt('Swap "'+ex.exerciseName+'" for:\n\n'+opts.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const idx = parseInt(c,10);
  if (!idx || idx < 1 || idx > opts.length) return;
  if (!ex.swappedFrom) ex.swappedFrom = ex.exerciseName;
  ex.exerciseName = opts[idx-1];
  scheduleSave(); renderToday();
}
function openAddExercise(){
  const groups = Object.keys(SWAP_LIBRARY);
  const g = prompt('Add an exercise — pick a group:\n\n'+groups.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const gi = parseInt(g,10);
  if (!gi || gi < 1 || gi > groups.length) return;
  const group = groups[gi-1], opts = SWAP_LIBRARY[group];
  const c = prompt('Pick an exercise:\n\n'+opts.map((o,n)=>(n+1)+'. '+o).join('\n')+'\n\nEnter a number:');
  const ci = parseInt(c,10);
  if (!ci || ci < 1 || ci > opts.length) return;
  state.dayData.exercises.push({
    exerciseName: opts[ci-1], group: group, targetSets: 3, targetReps: '10-12', repTop: 12, rpe: '',
    repsOnly: group === 'Core', swappedFrom: null, added: true,
    sets: [{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]
  });
  scheduleSave(); renderToday();
}
</script>
<script>
/* =========================================================================
   FOOD TAB — free choice, no fixed plan
   ========================================================================= */
async function renderFood(){
  const d = await ensureDay();
  const main = document.getElementById('main-content');
  const tot = foodTotals(d);
  let html = '<h2 style="font-size:17px;margin-bottom:10px;">Food</h2>' + affirmHtml('meals');
  html += '<div class="search-wrap"><input class="extra-search" id="food-search" placeholder="Search and add anything you ate…" oninput="searchFood(this.value)">'
    + '<div class="search-results" id="food-results" hidden></div></div>';

  if (!d.foods.length){
    html += '<div class="field"><div class="msg">Nothing logged yet today. Search above to add what you ate.</div></div>';
  } else {
    html += '<div class="card"><div class="card-body" style="padding-top:12px;">';
    d.foods.forEach((f,i)=>{
      html += '<div class="food-row"><div class="fi-body"><div class="fi-name">'+esc(f.name)+'</div>'
        + '<div class="fi-macro">'+f.cal+' cal · '+f.protein+'g P · '+f.carb+'g C · '+f.fat+'g F</div></div>'
        + '<div class="rm" onclick="removeFood('+i+')">remove</div></div>';
    });
    html += '</div></div>';
  }

  html += '<div class="totals-card"><h3 style="font-size:14px;margin-bottom:8px;">Today’s totals</h3>'
    + '<div class="trow"><span>Calories</span><b>'+tot.cal+'</b></div>'
    + '<div class="trow"><span>Protein</span><b>'+tot.protein+'g</b></div>'
    + '<div class="trow"><span>Carbs</span><b>'+tot.carb+'g</b></div>'
    + '<div class="trow"><span>Fat</span><b>'+tot.fat+'g</b></div></div>';
  html += '<div class="field" style="margin-top:14px;"><label>Notes</label><textarea oninput="updateField(\'mealNotes\', this.value)" placeholder="e.g. big lunch, skipped breakfast">'+esc(d.mealNotes)+'</textarea></div>';
  html += '<div class="link-row"><a href="#" onclick="selectTab(\'today\');return false;">← Back to Today</a><a href="#" onclick="selectTab(\'dashboard\');return false;">Progress →</a></div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}
function searchFood(q){
  const box = document.getElementById('food-results');
  if (!box) return;
  if (!q || !q.trim()){ box.hidden = true; box.innerHTML=''; return; }
  const ql = q.trim().toLowerCase(); const matches = [];
  FOOD_DB.forEach((f,idx)=>{ if (matches.length < 15 && f.name.toLowerCase().indexOf(ql) !== -1) matches.push({f:f, idx:idx}); });
  if (!matches.length){ box.hidden = true; return; }
  box.innerHTML = matches.map(m=>'<div onclick="addFood('+m.idx+')">'+esc(m.f.name)+' <span style="color:var(--ink-soft);">('+esc(m.f.serving)+' · '+m.f.cal+' cal)</span></div>').join('');
  box.hidden = false;
}
function addFood(idx){
  const f = FOOD_DB[idx];
  state.dayData.foods.push({ name: f.name+' ('+f.serving+')', cal:f.cal, protein:f.protein, carb:f.carb, fat:f.fat });
  scheduleSave(); renderFood();
}
function removeFood(i){ state.dayData.foods.splice(i,1); scheduleSave(); renderFood(); }

/* =========================================================================
   TRAINING NOTES TAB
   ========================================================================= */
function renderNotes(){
  const main = document.getElementById('main-content');
  let html = '<h2 style="font-size:17px;margin-bottom:12px;">Training notes</h2>';
  html += '<div class="card"><div class="card-body" style="padding-top:14px;">';
  TRAINING_NOTES.forEach(n=>{
    html += '<div class="notes-block"><h4>'+esc(n.title)+'</h4>' + n.body.map(p=>'<p>'+esc(p)+'</p>').join('') + '</div>';
  });
  html += '</div></div>';
  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Warm-ups</h3>';
  html += '<div class="warmup"><h4>Upper day</h4><ol>'+WARMUPS.upper.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ol></div>';
  html += '<div class="warmup"><h4>Lower day</h4><ol>'+WARMUPS.lower.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ol></div>';
  html += '<h3 style="font-size:15px;margin:18px 0 8px;">The weekly split</h3><div class="card"><div class="card-body" style="padding-top:12px;">'
    + [[1,'Monday'],[2,'Tuesday'],[3,'Wednesday'],[4,'Thursday'],[5,'Friday'],[6,'Saturday'],[0,'Sunday']].map(p=>{
        const s = SESSIONS[WEEKDAY_SESSION[p[0]]];
        return '<div class="lift-row"><span class="lname">'+p[1]+'</span><span class="lval">'+esc(s.title)+'</span></div>';
      }).join('')
    + '</div></div>';
  html += '<div class="link-row"><a href="#" onclick="selectTab(\'today\');return false;">← Back to Today</a></div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}

/* =========================================================================
   PROGRESS TAB
   ========================================================================= */
async function renderDashboard(){
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="padding:30px 0;text-align:center;color:var(--ink-soft);">Loading…</div>';
  const allDays = await getAllDays();
  const startStr = state.programStart, startDate = parseIso(startStr), today = new Date();
  const daysElapsed = Math.max(1, Math.floor((today - startDate)/86400000) + 1);
  const week = Math.max(1, Math.ceil(daysElapsed/7)), cw = cycleWeek(week);

  let sessions=0, cardioSessions=0, cardioMinutes=0, stepsSum=0, stepsDays=0, totalSpend=0;
  let learningSessions=0, journals=0, uniActivities=0, gutDays=0;
  let calSum=0,pSum=0,cSum=0,fSum=0,foodDays=0, waterSum=0, waterDays=0;
  const weightPoints=[], dayMap={}, liftLog={};
  const gutCounts = {};

  allDays.forEach(row=>{
    const dd = mergeDay(defaultDay(row.date), row.data);
    dayMap[row.date] = dd;
    if (dd.trained) sessions++;
    if (dd.cardio.done) cardioSessions++;
    cardioMinutes += num(dd.cardio.minutes,0);
    if (num(dd.cardio.steps,0) > 0){ stepsSum += num(dd.cardio.steps,0); stepsDays++; }
    totalSpend += Object.keys(dd.spend).reduce((a,k)=>a+num(dd.spend[k],0),0);
    dd.learning.entries.forEach(e=>{ if ((e.title&&e.title.trim())||(e.insight&&e.insight.trim())) learningSessions++; });
    if (dd.evening.journal && dd.evening.journal.trim()) journals++;
    uniActivities += (dd.uni.activities||[]).length;
    (dd.stomach.symptoms||[]).forEach(s=>{ if (s !== 'No issues'){ gutCounts[s] = (gutCounts[s]||0)+1; } });
    if ((dd.stomach.symptoms||[]).some(s=>s!=='No issues')) gutDays++;
    const t = foodTotals(dd);
    if (t.cal > 0){ calSum+=t.cal; pSum+=t.protein; cSum+=t.carb; fSum+=t.fat; foodDays++; }
    if (num(dd.waterOz,0) > 0){ waterSum += num(dd.waterOz,0); waterDays++; }
    if (dd.weight) weightPoints.push({date:row.date, weight:dd.weight});
    dd.exercises.forEach(ex=>{
      if (MAIN_LIFTS.indexOf(ex.exerciseName) !== -1){
        const ws = ex.sets.map(s=>num(s.weight,0)).filter(w=>w>0);
        if (ws.length){
          if (!liftLog[ex.exerciseName]) liftLog[ex.exerciseName] = { first:null, best:0 };
          const r = liftLog[ex.exerciseName];
          if (r.first === null) r.first = Math.max.apply(null, ws);
          r.best = Math.max(r.best, Math.max.apply(null, ws));
        }
      }
    });
  });
  weightPoints.sort((a,b)=>a.date.localeCompare(b.date));
  const avg = (s,c)=> c>0 ? Math.round(s/c) : 0;
  const tile = (v,l)=>'<div class="stat-tile"><div class="num">'+v+'</div><div class="lbl">'+l+'</div></div>';

  let html = '<h2 style="font-size:17px;margin-bottom:10px;">Progress</h2>';
  html += '<div class="field"><label>Programme start date</label><input type="date" value="'+startStr+'" onchange="changeProgramStart(this.value)"></div>';
  html += '<div style="font-size:13px;color:var(--ink-soft);">Day '+daysElapsed+' · Week '+week+' · Cycle week '+cw+' of 5'+(isDeload(week)?' (deload)':'')+' · '+allDays.length+' days logged</div>';
  html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+Math.min(100,(cw/5)*100)+'%"></div></div>';

  html += '<div class="stat-grid">'
    + tile(sessions,'Training sessions')
    + tile(cardioSessions,'Cardio sessions')
    + tile(Math.round(cardioMinutes),'Cardio minutes')
    + tile(avg(stepsSum,stepsDays).toLocaleString(),'Avg daily steps')
    + tile(avg(pSum,foodDays)+'g','Avg protein/day')
    + tile(avg(calSum,foodDays),'Avg calories/day')
    + tile(avg(cSum,foodDays)+'g','Avg carbs/day')
    + tile(avg(fSum,foodDays)+'g','Avg fat/day')
    + tile(avg(waterSum,waterDays)+'oz','Avg water/day')
    + tile('£'+Math.round(totalSpend),'Total spend')
    + tile(uniActivities,'Uni activities logged')
    + tile(learningSessions,'Learning sessions')
    + tile(journals,'Journal entries')
    + tile(gutDays,'Days with gut symptoms')
    + '</div>';

  const gutKeys = Object.keys(gutCounts);
  if (gutKeys.length){
    html += '<h3 style="font-size:15px;margin:18px 0 8px;">Stomach symptoms</h3><div class="card"><div class="card-body" style="padding-top:12px;">'
      + gutKeys.sort((a,b)=>gutCounts[b]-gutCounts[a]).map(k=>'<div class="lift-row"><span class="lname">'+esc(k)+'</span><span class="lval">'+gutCounts[k]+' day'+(gutCounts[k]>1?'s':'')+'</span></div>').join('')
      + '</div></div>';
  }

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Strength progress</h3><div class="card"><div class="card-body" style="padding-top:12px;">';
  const liftNames = Object.keys(liftLog);
  if (!liftNames.length) html += '<div class="msg">No main lifts logged yet.</div>';
  else liftNames.forEach(n=>{
    const r = liftLog[n], change = r.best - r.first;
    html += '<div class="lift-row"><span class="lname">'+esc(n)+'</span><span class="lval">'+r.first+' → '+r.best+' ('+(change>=0?'+':'')+change+')</span></div>';
  });
  html += '</div></div>';

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Weight trend</h3>';
  if (weightPoints.length < 2) html += '<div class="rest-msg">Log weight on at least two days to see a trend.</div>';
  else {
    const W=340,H=120,pad=20;
    const ws = weightPoints.map(p=>p.weight);
    const minW=Math.min.apply(null,ws), maxW=Math.max.apply(null,ws), range=(maxW-minW)||1;
    const stepX=(W-2*pad)/(weightPoints.length-1);
    const pts = weightPoints.map((p,i)=>(pad+i*stepX)+','+(H-pad-((p.weight-minW)/range)*(H-2*pad)));
    html += '<div class="card"><div class="card-body" style="padding-top:14px;">'
      + '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'"><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--sage)" stroke-width="2.5"/>'
      + pts.map(p=>{const q=p.split(','); return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="var(--sage)"/>';}).join('')
      + '</svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;">'
      + '<span>'+weightPoints[0].weight+' lbs</span><span>'+weightPoints[weightPoints.length-1].weight+' lbs</span></div></div></div>';
  }

  html += '<h3 style="font-size:15px;margin:18px 0 8px;">Training heatmap</h3>';
  let cells = '';
  for (let i=0;i<91;i++){
    const cd = new Date(startDate); cd.setDate(cd.getDate()+i);
    const cds = isoDate(cd);
    let color = '#EDEBDE';
    if (cd <= today){
      const restDay = SESSIONS[WEEKDAY_SESSION[dow(cd)]].type === 'rest';
      if (restDay) color = 'var(--gold)';
      else if (dayMap[cds] && dayMap[cds].trained) color = 'var(--moss)';
      else color = 'var(--rose)';
    }
    cells += '<div class="heat-cell" style="background:'+color+'" title="'+cds+'"></div>';
  }
  html += '<div class="heatmap-grid">'+cells+'</div>'
    + '<div class="legend"><span><i style="background:var(--moss)"></i>Trained</span><span><i style="background:var(--gold)"></i>Rest day</span>'
    + '<span><i style="background:var(--rose)"></i>Missed</span><span><i style="background:#EDEBDE"></i>Upcoming</span></div>';

  html += '<div class="signout-link" onclick="sb.auth.signOut()">Sign out</div>';
  html += '<div class="build-tag">build '+BUILD_ID+'</div>';
  main.innerHTML = html;
  updateDateNav();
}
async function changeProgramStart(v){
  state.programStart = v;
  await setSetting('programStart', {date:v});
  state.allDaysCache = null; state.recentDaysCache = null;
  await getRecentDays();
  await renderDashboard();
}
</script>
